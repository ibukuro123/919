<style>

    --paper:#F1F3EF;
    --paper-deep:#E1E6E1;
    --edge:#C9D1CC;
    --ink:#1F2629;

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#CDD5D0;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),

  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#3E4A4C;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5F6B6D;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5F6B6D;stroke-width:1;}
  .tick{stroke:#5F6B6D;stroke-width:1;}
  .tick.mm{stroke:#5F6B6D;opacity:.45;}
  .num{fill:#5F6B6D;font-size:9px;font-family:inherit;}
  #liq{transition:width .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:printin .9s steps(6) both;}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(30,45,44,.28));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(110,140,136,.14), transparent 60%);

    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(50,70,68,.4);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(50,70,68,.4);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(50,70,68,.4);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(50,70,68,.4);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(70,90,88,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(70,90,88,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#3E4A4C;font-size:.94em;
    border-left:2px solid rgba(80,110,108,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(80,110,108,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(70,90,88,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(70,90,88,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#4A5658;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(20,30,30,.45);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#3E4A4C;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(70,90,88,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(70,90,88,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(70,90,88,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#3E4A4C;
    border-left:1px solid rgba(70,90,88,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#3E4A4C;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(70,90,88,.4);cursor:pointer;color:#3E4A4C;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#F1F3EF;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(70,90,88,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:var(--stubno,"No.");position:absolute;top:14px;right:-6px;padding:16px 10px 12px 14px;background:#F7F6F1;border:1px solid #C9CEC9;border-right:none;box-shadow:-2px 3px 8px rgba(30,45,44,.22);writing-mode:vertical-rl;font-family:"DotGothic16",monospace;font-size:12px;letter-spacing:.12em;color:#47567E;background-image:radial-gradient(circle,#B9C2BF 1.1px,transparent 1.3px);background-size:6px 6px;background-repeat:repeat-y;background-position:3px 0;z-index:4;pointer-events:none;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(122,78,53,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(122,78,53,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}

  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
  .nextnav{margin:2.4em 0 0;text-align:center;text-indent:0;line-height:2;}
  .nextnav .lead{display:block;font-size:.8em;letter-spacing:.3em;color:var(--ink-soft);}
  .nextnav a{display:inline-block;margin-top:.4em;padding:.35em 1.1em;border:1px solid rgba(122,78,53,.55);color:var(--shu);
    text-decoration:none;letter-spacing:.12em;font-size:.95em;}
  .nextnav a + a{margin-left:.8em;}
  .page .opener.cov{overflow:hidden;}
  .page .opener.cov .covbg{position:absolute;left:-12px;right:-12px;height:52%;background-repeat:no-repeat;background-size:100% 4000%;filter:blur(6px);}
  .page .opener.cov .covbg.t{top:-12px;background-position:center top;}
  .page .opener.cov .covbg.b{bottom:-12px;background-position:center bottom;}
  .page .opener.cov img{position:relative;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);}
  .page .opener.cov.lr .covbg{top:-12px;bottom:-12px;height:auto;width:52%;background-size:4000% 100%;}
  .page .opener.cov.lr .covbg.t{left:-12px;right:auto;background-position:left center;}
  .page .opener.cov.lr .covbg.b{right:-12px;left:auto;bottom:-12px;background-position:right center;}
  .page .opener.cov.lr img{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);}

  #covpick{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:6px;align-items:center;font-size:12px;color:#3E4A4C;background:rgba(241,243,239,.92);border:1px solid #C9D1CC;padding:6px 8px;border-radius:999px;font-family:sans-serif}
  #covpick button{font:inherit;border:1px solid #9AA6A8;background:#fff;color:#3E4A4C;width:26px;height:26px;border-radius:50%;cursor:pointer}
  #covpick button[aria-pressed="true"]{background:#7A4E35;color:#fff;border-color:#7A4E35}
  body.vert .page .up{text-orientation:upright;letter-spacing:0;}
  .page .nb{white-space:nowrap;}
  body.vert .page .sw{text-orientation:sideways;}
  .page .opener.lab{background:#F1F3EF;}
  .opener.lab .tag{background:#FBFBF8;border-top:1px solid #C9D1CC;border-bottom:1px solid #C9D1CC;width:100%;padding:28px 0 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 1px 0 #fff inset;}
  .opener.lab .n{font-size:13px;letter-spacing:.4em;color:var(--ink-soft);}
  .opener.lab .t{font-size:28px;letter-spacing:.3em;color:var(--ink);padding-left:.3em;}
  .page .opener.lab{flex-direction:column;justify-content:center;align-items:stretch;}
  .opener.lab .tag{align-self:stretch;}
  /* 縦書きの章扉：右上から縦に、記録番号は左下 */
  body.vert .opener.lab .tag{background:none;border:none;box-shadow:none;width:auto;padding:0;flex-direction:row-reverse;align-items:flex-start;gap:22px;align-self:flex-end;}
  body.vert .page .opener.lab{justify-content:flex-start;align-items:flex-end;padding:20% 17% 0 0;}
  body.vert .opener.lab .n,body.vert .opener.lab .t{writing-mode:vertical-rl;}
  body.vert .opener.lab .n{font-size:14px;letter-spacing:.45em;margin-top:8px;}
  body.vert .opener.lab .t{font-size:39px;letter-spacing:.28em;padding-left:0;}
  body.vert .opener.lab .t.long{font-size:33px;letter-spacing:.22em;}

  .opener.lab .lead{margin:30px auto 0;max-width:86%;text-wrap:balance;font-size:13.5px;line-height:2;letter-spacing:.06em;color:var(--ink-soft);text-align:center;}
  .page .opener.stub{flex-direction:column;gap:28px;background:#F1F3EF;}
  .stub .ticket{position:relative;width:min(70%,260px);background:#F7F6F1;border:1px solid #C9CEC9;padding:26px 18px 22px;text-align:center;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 14px -8px rgba(30,45,44,.35);}
  .stub .ticket .perf{position:absolute;left:-1px;right:-1px;top:-6px;height:12px;background:radial-gradient(circle at 6px 6px,#F1F3EF 3.6px,transparent 4px) repeat-x;background-size:12px 12px;}
  .stub .k{font-size:12px;letter-spacing:.4em;color:var(--ink-soft);}
  .stub .no{font-family:"DotGothic16",monospace;font-size:34px;letter-spacing:.1em;color:#47567E;}
  .stub .d{font-family:"DotGothic16",monospace;font-size:12px;color:#8A8574;letter-spacing:.1em;}
  .stub .back{font:inherit;font-size:13px;letter-spacing:.3em;background:none;border:1px solid rgba(122,78,53,.55);color:var(--shu);padding:8px 22px;cursor:pointer;position:relative;z-index:5;}
</style>

<script>
const DATA = {"title": "919 エピソード2／消えかけた湯気", "sub": "消えかけた湯気", "blocks": [{"t": "opener", "i": 0, "alt": "序章　入り口の男", "lead": "朝の七時、共同の食堂には、もう長い列ができていた。"}, {"t": "p", "h": "朝の七時、共同の食堂には、もう長い列ができていた。"}, {"t": "p", "h": "よしゆきは列の後ろに並んで、入り口の機械に配給券をかざした。白い光が一度だけまたたいて、トレイが一枚せり出してくる。茶碗に半分のご飯と、薄い汁と、煮豆がひとさじ。券の端には、今朝の四桁の番号が印字されていた。"}, {"t": "p", "h": "上着のポケットには、いつもの瓶が一本と、二つに折った紙が入っていた。"}, {"t": "p", "h": "よしゆきは、窓ぎわの長いテーブルの、いつもの席に座った。"}, {"t": "p", "h": "しばらくして、寝ぐせの頭が入ってきた。"}, {"t": "p", "h": "「おせーよ」"}, {"t": "p", "h": "「お前が早すぎんだよ」"}, {"t": "p", "h": "かずまが隣に座る。よしゆきは何も言わずに、トレイをかずまの前へ押しやった。かずまも何も言わずに、箸を取った。"}, {"t": "p", "h": "男が一人、券もかざさずに、入り口に立っていた。"}, {"t": "p", "h": "がっしりした体つきで、肩幅が広く、首が太かった。両わきを短く刈りあげて、上の髪を濡れたように後ろへなでつけ、立てている。刈りあげたところに、白いものがまじっていた。顎の先にだけ、短いひげを残している。目が、丸く大きかった。耳に、短い鉛筆をはさんでいた。"}, {"t": "p", "h": "男は、列には並ばなかった。食堂の中を、端から端まで、ゆっくり見わたしていた。"}, {"t": "p", "h": "その目が、窓ぎわで止まった。"}, {"t": "p", "h": "かずまの箸が、止まった。茶碗を置いて、立ちあがった。"}, {"t": "p", "h": "「……おっちゃん」"}, {"t": "p", "h": "声が、いつもより高かった。よしゆきの知らない声だった。"}, {"t": "p", "h": "男は、テーブルのあいだを通って、こちらへ歩いてきた。二人の前で止まった。手は、上着のポケットに入れたままだった。"}, {"t": "p", "h": "「でかくなったな」"}, {"t": "p", "h": "かずまを見て、男は言った。"}, {"t": "p", "h": "「十年だぞ。どこ行ってたんだよ、おっちゃん」"}, {"t": "p", "h": "「あっちこっちだよ。この前、こっちに来た」"}, {"t": "p", "h": "「なんでまた」"}, {"t": "p", "h": "「呼ばれたんだよ」"}, {"t": "p", "h": "男は、それ以上は言わなかった。"}, {"t": "p", "h": "「おっちゃんの飯、まずかったよなあ。こっちのほうが、まだましだわ」"}, {"t": "p", "h": "「まずかっただろ。米が悪いんだよ、米が」"}, {"t": "p", "h": "かずまが、声をあげて笑った。男は笑わなかった。それから、よしゆきを見た。"}, {"t": "p", "h": "「お前は、背は変わんねえな」"}, {"t": "p", "h": "言いきって、男は目を丸く見開き、口をすぼめて、少し横に寄せた。"}, {"t": "p", "h": "よしゆきは、その顔を見た。額も、目も、ひげも、見た。どこにも、覚えがなかった。"}, {"t": "p", "h": "「よしゆき。おっちゃんだろ。炊事場の」"}, {"t": "p", "h": "かずまが、よしゆきの肩をたたいた。"}, {"t": "p", "h": "炊事場、という言葉は分かった。寮の廊下の、突きあたりにあった部屋だ。そこまでは、たどれた。その先に、何があったのか。誰がいたのか。"}, {"t": "p", "h": "よしゆきは、何も返せなかった。"}, {"t": "p", "h": "男は、それ以上は何も言わなかった。かずまにも、よしゆきにも、触れなかった。"}, {"t": "p", "h": "「また来るよ」"}, {"t": "p", "h": "それだけ言って、男は入り口のほうへ戻っていった。"}, {"t": "p", "h": "かずまは、まだ立ったまま、男の背中を見ていた。口の端が、子どものように上がっていた。"}, {"t": "p", "h": "よしゆきだけが、座ったままだった。"}, {"t": "p", "h": "男が出ていってから、かずまは残りのご飯をかきこんだ。よしゆきは、空になったトレイを、返却口まで持っていった。灰色の作業着の手が、黙ってそれを受けとった。"}, {"t": "p", "h": "ポケットの中で、瓶が、紙に当たって小さく鳴った。"}, {"t": "opener", "i": 1, "alt": "第一章　白く抜けた戸", "lead": "昼すぎ、よしゆきは、第二配給所の入り口で、券を読む機械のふたを開けていた。"}, {"t": "p", "h": "昼すぎ、よしゆきは、第二配給所の入り口で、券を読む機械のふたを開けていた。"}, {"t": "p", "h": "券を読みそこねる、という話だった。ねじを外していくと、光を受ける小さな窓が、うすく曇っていた。指でふいた。手は、考えるより先に動いた。"}, {"t": "p", "h": "ふたを閉めて、券をかざした。白い光が一度だけまたたいた。"}, {"t": "p", "h": "夕方、配給所の入り口の横にある、手すりのついたゆるい坂の、低いふちに腰かけていると、配達の車が止まった。荷台から、寝ぐせの頭がのぞいた。"}, {"t": "p", "h": "「お、修理屋」"}, {"t": "p", "h": "かずまは荷台から飛びおりて、よしゆきの横に座った。座ったとたんに、しゃべりだした。"}, {"t": "p", "h": "「おっちゃん、かくじっていうんだよ。名前、知ってたか」"}, {"t": "p", "h": "「知らねーよ」"}, {"t": "p", "h": "「寮の炊事場で、でっかい釜、毎日ひとりで回してたんだよ。朝なんか、まだ暗いうちから湯気たてて」"}, {"t": "p", "h": "かずまは、両手で大きな輪を作ってみせた。"}, {"t": "p", "h": "「俺の『検証』な。あれ、おっちゃんの口ぐせなんだよ。なんでも賭けて、なんでも確かめんの」"}, {"t": "p", "h": "「……ふーん」"}, {"t": "p", "h": "「十年近く前に、急にやめたんだよ。誰にも言わねえで。十年、どこにいるかも知らなかったんだよ」"}, {"t": "p", "h": "かずまは、膝を抱えて、夕方の空を見た。それから、よしゆきのほうを向いた。"}, {"t": "p", "h": "「お前、おっちゃんの飯、いちばん先に並んで食ってたろ。毎朝」"}, {"t": "p", "h": "よしゆきは、思いだそうとした。"}, {"t": "p", "h": "寮の廊下は、覚えていた。長くて、床がきしんで、窓が北を向いていた。二段の寝台の、上が自分で、下がかずまだった。"}, {"t": "p", "h": "廊下の突きあたりに、炊事場があった。そこまでは、たどれた。"}, {"t": "p", "h": "戸を開けた先が、白く抜けていた。湯気も、釜も、大きな手も、何もなかった。並んでいたという列も、そこで食べたという飯も。その中に何があったのかだけが、白く抜けていた。"}, {"t": "p", "h": "「……覚えてねーよ」"}, {"t": "p", "h": "口に出してから、自分の声が、思ったより小さいことに気づいた。"}, {"t": "p", "h": "かずまが、こちらを見た。笑いかけた口の形のまま、少しのあいだ、止まっていた。"}, {"t": "p", "h": "「……ま、十年たってるしな」"}, {"t": "p", "h": "かずまは膝をたたいて、立ちあがった。荷台に飛びのる前に、一度だけ振りかえった。"}, {"t": "p", "h": "その夜、よしゆきは、部屋の流しの下の戸棚を開けた。"}, {"t": "p", "h": "ゆうべ、紙袋から出して、そこにしまった一本があった。透明な瓶に、透明な中身。白いラベルに、番号だけが小さく印字されている。"}, {"t": "p", "h": "<span class=\"up\">920</span>。"}, {"t": "p", "h": "帰り道、ヤマにはじめて渡された瓶も、こうだった。ラベルには、「<span class=\"up\">919</span>」とだけ書いてあった。"}, {"t": "p", "h": "よしゆきは、瓶を手の中で一度だけ回した。それから、戸棚の奥に戻して、戸を閉めた。"}, {"t": "p", "h": "閉めたあとも、しばらく、流しの前から動かなかった。"}, {"t": "opener", "i": 2, "alt": "第二章　半分のご飯", "lead": "次の朝、列の前のほうに、がっしりした背中が並んでいた。"}, {"t": "p", "h": "次の朝、列の前のほうに、がっしりした背中が並んでいた。両わきを刈りあげた頭が、ほかの頭より一つ高かった。"}, {"t": "p", "h": "かくじだった。"}, {"t": "p", "h": "かくじは、入り口の機械に券をかざして、トレイを受けとった。そのまま、まっすぐ窓ぎわへ来て、かずまの向かいに座った。かずまは、もうよしゆきのトレイを前に置いて、箸を動かしていた。"}, {"t": "p", "h": "「お前の券、どうした」"}, {"t": "p", "h": "かくじが、かずまのトレイを顎でさした。"}, {"t": "p", "h": "「取られた。一年分」"}, {"t": "p", "h": "「誰に」"}, {"t": "p", "h": "「……知らねえやつに」"}, {"t": "p", "h": "かずまは、それ以上は言わなかった。かくじも、聞かなかった。自分の茶碗を手に取って、ご飯の半分を、かずまの茶碗に移した。箸で、きっちり半分だった。"}, {"t": "p", "h": "「は？　いいって」"}, {"t": "p", "h": "「食えよ。でかくなったんだから」"}, {"t": "p", "h": "かずまは、何か言いかえそうとして、やめた。黙って、移されたご飯を口に入れた。"}, {"t": "p", "h": "かくじの目が、よしゆきの前に移った。"}, {"t": "p", "h": "テーブルには、何も置かれていなかった。茶碗も、箸も。"}, {"t": "p", "h": "「お前、食わねえで動いてんのか」"}, {"t": "p", "h": "よしゆきは、答えなかった。"}, {"t": "p", "h": "「理屈は」"}, {"t": "p", "h": "かくじは、それだけ聞いた。責めるような声ではなかった。修理の手順を聞くような声だった。"}, {"t": "p", "h": "よしゆきは、窓の外を見た。かずまの箸の音が、止まっていた。"}, {"t": "p", "h": "かくじは、それ以上は聞かなかった。かわりに、汁をひと口すすって、話しはじめた。"}, {"t": "p", "h": "「寮の炊事場な。朝、まだ暗えうちに、釜に火入れんだよ。でかい釜が三つあってよ。炊きあがる前に、ふた上げんの。ほんのちょっとだけな」"}, {"t": "p", "h": "かくじは、自分の茶碗の上に、大きな手をかざしてみせた。"}, {"t": "p", "h": "「そしたら、湯気がぶわっと出て、前がなんにも見えなくなんだよ。釜も、壁も、窓も。湯気の向こうで、ガキどもの声だけ聞こえてな。もう並んでんだよ、まだ炊けてもねえのに」"}, {"t": "p", "h": "かずまが、笑った。"}, {"t": "p", "h": "「並んでた、並んでた。寒いのにさ」"}, {"t": "p", "h": "「寒いのにな」"}, {"t": "p", "h": "よしゆきは、その話を聞いていた。"}, {"t": "p", "h": "暗い炊事場。三つの釜。ふたを上げると、湯気で前が見えなくなる。"}, {"t": "p", "h": "言葉は、一つずつ分かった。話としても、分かった。けれど、何も浮かんでこなかった。暗さも、釜も、湯気も。知らない町の、知らない誰かの話を聞いているようだった。"}, {"t": "p", "h": "かくじが、よしゆきの顔を見ていた。"}, {"t": "p", "h": "「覚えてねえだろ。顔に書いてある」"}, {"t": "p", "h": "言いきって、かくじは目を丸く見開き、口をすぼめて、少し横に寄せた。"}, {"t": "p", "h": "よしゆきは、目をそらさなかった。そらす理由が、見つからなかった。"}, {"t": "p", "h": "かずまが、箸を置いた。"}, {"t": "p", "h": "「……おっちゃん。こいつ、ちょっと、いろいろあってさ」"}, {"t": "p", "h": "「言わなくていい。顔見りゃ分かんだよ」"}, {"t": "p", "h": "かくじは、空になった茶碗を持って、立ちあがった。"}, {"t": "p", "h": "「また話してやるよ。同じ話でよけりゃな」"}, {"t": "opener", "i": 3, "alt": "第三章　列の話", "lead": "夕方、仕事の帰りに、食堂の裏の細い道を通った。"}, {"t": "p", "h": "夕方、仕事の帰りに、食堂の裏の細い道を通った。"}, {"t": "p", "h": "閉まったシャッターの前に、ヤマがしゃがんでいた。"}, {"t": "p", "h": "「お帰りなさい、<span class=\"up\">919</span>さん」"}, {"t": "p", "h": "ヤマは立ちあがって、薄い白い端末を、よしゆきの顔の高さにかまえた。小さな赤い光が、一度だけまたたいた。ヤマは、画面をのぞいた。"}, {"t": "p", "h": "「少しだけ、上がってますね。町に戻ってから、ずっと同じだったんですけど」"}, {"t": "p", "h": "それから、片方の口角だけを上げた。"}, {"t": "p", "h": "「<span class=\"up\">919</span>さん。どんな気持ち？」"}, {"t": "p", "h": "「……別に」"}, {"t": "p", "h": "ヤマは、すぐには何も言わなかった。画面に指を当てて、何か打ちこんだ。打ちこみおえてから、口角を下ろした。"}, {"t": "p", "h": "施設でも、毎日、同じことを聞かれた。よしゆきは、一度も答えなかった。それでも、ヤマは、画面に何か書いていた。何を答えるかより、どう反応するかを、見ているのかもしれなかった。"}, {"t": "p", "h": "通りの向こうを、がっしりした背中が横切った。両わきを刈りあげた頭が、夕方の光の中で、白っぽく光っていた。"}, {"t": "p", "h": "ヤマが、そちらを見た。"}, {"t": "p", "h": "「かくじさん、お元気そうですね」"}, {"t": "p", "h": "「……知ってんのかよ」"}, {"t": "p", "h": "「この前、会いに行ったばかりです。昔の<span class=\"up\">919</span>さんのことを、聞きに」"}, {"t": "p", "h": "ヤマは、端末を上着のポケットにしまった。"}, {"t": "p", "h": "「では、また」"}, {"t": "p", "h": "足音はしなかった。ヤマは、通りの明かりの外へ歩いていった。"}, {"t": "p", "h": "よしゆきは、シャッターの前に立ったまま、動けなかった。昔の自分のことを、自分の知らないところで、誰かが話していた。"}, {"t": "p", "h": "その夜、配給所の坂のふちに、三人で腰かけた。"}, {"t": "p", "h": "かずまが、かくじを連れてきた。かくじは、手すりの柱を一本はさんで、少し離れたところに腰を下ろした。"}, {"t": "p", "h": "「なあ、おっちゃん。湯気の話、またしてよ」"}, {"t": "p", "h": "かずまに言われて、かくじは、けさと同じ話をした。暗い炊事場。三つの釜。ふたを上げると、湯気で前が見えなくなる。ガキどもの声だけが聞こえる。"}, {"t": "p", "h": "同じ話を聞くのは、二度目だった。"}, {"t": "p", "h": "知っている気がした。どこかで、もう聞いたことがある気がした。けれど、それだけだった。湯気も、釜も、浮かんでこなかった。"}, {"t": "p", "h": "「もう一個あんだろ。列の話」"}, {"t": "p", "h": "かずまが、肘でかくじをつついた。かくじは、よけなかった。"}, {"t": "p", "h": "「炊事場の前に、列ができんだよ。そこで茶碗受けとって、隣の食堂で食うんだよ。いちばん前は、毎朝こいつだ」"}, {"t": "p", "h": "かくじが、顎でよしゆきをさした。"}, {"t": "p", "h": "「こいつ、毎朝いちばんに並んでんだよ。かずまは、毎朝遅れてくる。なのに、明日は先に来るって、毎朝俺に張ってくんだよ。毎朝外してよ」"}, {"t": "p", "h": "かくじが、顎でかずまをさした。かずまが、笑った。"}, {"t": "p", "h": "「でな、遅れてきたかずまに、ちっちぇえのが言うんだよ。『おせーよ』って。そしたらかずまが、『お前が早すぎんだよ』」"}, {"t": "p", "h": "よしゆきの手が、膝の上で止まった。"}, {"t": "p", "h": "毎朝、言っている言葉だった。"}, {"t": "p", "h": "「俺が、検証だろ、って言ってよ。それから、毎朝それだよ。お前ら」"}, {"t": "p", "h": "かくじは、言葉より先に、親指を立てた。"}, {"t": "p", "h": "よしゆきは、その親指を見ていた。話としては、分かった。毎朝の言葉が、どこから来たのかも、分かった。"}, {"t": "p", "h": "けれど、その朝の列も、自分の小さな声も、どこにもなかった。"}, {"t": "opener", "i": 4, "alt": "第四章　濡れた木のにおい", "lead": "それから、かくじは、毎朝食堂に来た。"}, {"t": "p", "h": "それから、かくじは、毎朝食堂に来た。"}, {"t": "p", "h": "列に並んで、券をかざして、窓ぎわのかずまの向かいに座る。ご飯の半分を、かずまの茶碗に移す。それから、汁をひと口すすって、話しはじめる。"}, {"t": "p", "h": "いつも、同じ話だった。"}, {"t": "p", "h": "「寮の炊事場な。朝、まだ暗えうちに、釜に火入れんだよ」"}, {"t": "p", "h": "かずまは、何度聞いても笑った。よしゆきは、黙って聞いていた。"}, {"t": "p", "h": "三日目の朝だった。"}, {"t": "p", "h": "同じ話を聞くのは、三度目だった。"}, {"t": "p", "h": "かくじが、釜のふたを上げるところを、手でしてみせた。湯気がぶわっと出て、前がなんにも見えなくなる。"}, {"t": "p", "h": "そのとき、においがした。"}, {"t": "p", "h": "濡れた木と、熱い鉄のにおい。食堂の汁のにおいとは、ちがった。どこから来たのか、分からなかった。鼻の奥の、ずっと奥のほうから、のぼってきた。"}, {"t": "p", "h": "よしゆきは、顔を上げた。"}, {"t": "p", "h": "かくじは、話をやめていなかった。かずまも、いつものように笑っていた。誰も、においには気づいていなかった。においは、よしゆきの中にしかなかった。"}, {"t": "p", "h": "次の朝、四度目を聞いた。"}, {"t": "p", "h": "においが、また来た。今度は、それに大きな手がついてきた。濡れた木のふたの、ふちをつかむ手。指が太くて、爪のあいだが黒かった。その手が、ふたを持ちあげる。においが、ぶわっと広がる。"}, {"t": "p", "h": "よしゆきは、向かいに座っている男の手を見た。"}, {"t": "p", "h": "茶碗を置いて、テーブルの上にのせられた、大きな手だった。指が太かった。"}, {"t": "p", "h": "「……おっちゃん」"}, {"t": "p", "h": "自分の口から出た言葉に、よしゆきは自分で驚いた。"}, {"t": "p", "h": "かずまが、箸を止めた。かくじは、目を丸く見開いた。"}, {"t": "p", "h": "「ふたの、つかむとこ。木が、黒くなってたろ。手の形に」"}, {"t": "p", "h": "かくじは、しばらく黙っていた。それから、自分の手のひらを見た。"}, {"t": "p", "h": "「なってたよ。十年、同じとこつかんでたからな」"}, {"t": "p", "h": "かずまが、よしゆきの肩をつかんで揺すった。"}, {"t": "p", "h": "「おい。思いだしたのかよ」"}, {"t": "p", "h": "「……手だけ」"}, {"t": "p", "h": "よしゆきは、そう言うのがやっとだった。湯気の向こうの列も、自分の声も、まだどこにもなかった。手と、においだけが、そこにあった。"}, {"t": "p", "h": "かくじは、汁の椀を置いた。"}, {"t": "p", "h": "「理屈は、分かった気がする」"}, {"t": "p", "h": "「何がだよ」"}, {"t": "p", "h": "「お前、こいつとの毎朝のあれは、覚えてんだろ。『おせーよ』のやつ」"}, {"t": "p", "h": "「……覚えてる」"}, {"t": "p", "h": "「炊事場は、覚えてねえ。十年、誰も話さなかったからだろ」"}, {"t": "p", "h": "かくじは、かずまを顎でさした。"}, {"t": "p", "h": "「毎日同じこと言うやつが、隣にいたから、だろ。お前が、まだそこに座ってられんのは」"}, {"t": "p", "h": "言いきって、かくじは目を丸く見開き、口をすぼめて、少し横に寄せた。"}, {"t": "p", "h": "よしゆきは、隣を見た。かずまは、何のことか分からない顔で、よしゆきとかくじを、順に見ていた。"}, {"t": "p", "h": "「は？　俺がなんだよ」"}, {"t": "p", "h": "よしゆきは、答えなかった。"}, {"t": "p", "h": "かずまの寝ぐせが、窓からの光で、少しだけ透けていた。"}, {"t": "opener", "i": 5, "alt": "第五章　欠けた釜", "lead": "かくじの部屋は、町はずれの古い建物の、いちばん奥にあった。"}, {"t": "p", "h": "かくじの部屋は、町はずれの古い建物の、いちばん奥にあった。同じ形の戸が、薄暗い廊下にずらりと並んでいた。"}, {"t": "p", "h": "畳が四枚。窓が一つ。壁ぎわに、小さな釜が一つ置いてあった。黒くて、ふちが欠けていた。"}, {"t": "p", "h": "「炊事場から、これだけ持ってきた。でかいのは、三つとも持ってかれたからな」"}, {"t": "p", "h": "かくじは、それだけ言って、釜を七輪にのせた。紙袋から、米をひとつかみ出して、研いだ。どこで手に入れたのかは、言わなかった。水は、目で量った。"}, {"t": "p", "h": "かずまは、畳に大の字になった。"}, {"t": "p", "h": "「おっちゃんの部屋、なんもねえな」"}, {"t": "p", "h": "「いらねえんだよ、なんも」"}, {"t": "p", "h": "「なあ、覚えてる。とおるって、いたじゃん。あいつ、毎朝おかわりの列に二回並んでさ」"}, {"t": "p", "h": "「いたな。二回目で、いつもばれてた」"}, {"t": "p", "h": "「ゆうやは。寝しょんべんの」"}, {"t": "p", "h": "「布団、裏の物干しに毎朝だよ」"}, {"t": "p", "h": "「なおきは。なんでも賭けたがるくせに、一回も勝たねえの。茶碗の煮豆、偶数か奇数かで、毎日おかず取られてやんの」"}, {"t": "p", "h": "かずまは、名前を次々に出しては、笑った。かくじは、一つ残らず、知っていた。顔も、くせも、どこに座っていたかも。"}, {"t": "p", "h": "よしゆきは、窓のそばに座って、聞いていた。"}, {"t": "p", "h": "一つも、知らなかった。名前を聞いても、顔が浮かばなかった。同じ寮で、同じ飯を食べていたはずの子たちが、かずまの口の中にしか、いなかった。"}, {"t": "p", "h": "七輪の火が、ぱちりと鳴った。"}, {"t": "p", "h": "「なあ、おっちゃん。賭けようぜ」"}, {"t": "p", "h": "かずまが、起きあがって、釜を指さした。人差し指を頬に当てて、天井を見た。"}, {"t": "p", "h": "「ふたが鳴るの、湯気が先か、においが先か。俺は、においが先」"}, {"t": "p", "h": "「乗った。湯気だろ。何賭けんだよ」"}, {"t": "p", "h": "「おこげ」"}, {"t": "p", "h": "かくじは、それだけ聞いて、釜の前にしゃがんだ。"}, {"t": "p", "h": "「……湯気の話、もう一回」"}, {"t": "p", "h": "よしゆきが、言った。自分から頼んだのは、はじめてだった。かずまが、よしゆきを見た。それから、笑った。"}, {"t": "p", "h": "「またかよ」"}, {"t": "p", "h": "「何べんでも話すぞ」"}, {"t": "p", "h": "同じ話を聞くのは、五度目だった。"}, {"t": "p", "h": "暗い炊事場。三つの釜。かくじがふたを上げると、湯気で前が見えなくなる。"}, {"t": "p", "h": "湯気が、晴れていった。"}, {"t": "p", "h": "その向こうに、列があった。寒い廊下に、子どもが並んでいた。いちばん前に、小さな背中がいた。眉の上で切った前髪が、少しだけ不ぞろいだった。"}, {"t": "p", "h": "自分だった。"}, {"t": "p", "h": "うしろのほうから、ばたばたと足音が来る。寝ぐせの頭が、列の横を走ってくる。"}, {"t": "p", "h": "おせーよ、と、小さな自分が言った。"}, {"t": "p", "h": "よしゆきは、声を出さなかった。出せなかった。窓の外を見るふりをして、まばたきをした。"}, {"t": "p", "h": "七輪の上で、釜のふたが、かたかたと鳴りはじめた。ふちから、においがのぼってきた。それから、湯気が、すこし遅れて立った。"}, {"t": "p", "h": "「ほら、においが先」"}, {"t": "p", "h": "かずまが、勝ちほこった顔で、かくじを見た。"}, {"t": "p", "h": "かくじは、言葉より先に、親指を立てた。"}, {"t": "p", "h": "かずまが、声をあげて笑った。かくじは、笑わなかった。けれど、目尻が、ほんの少しだけ下がっていた。"}, {"t": "p", "h": "その夜、かくじが釜の底からこそいだおこげは、かずまの手のひらにのった。かずまは、熱い、熱いと言いながら、それを手のひらの上で転がした。"}, {"t": "p", "h": "よしゆきは、それを見ていた。"}, {"t": "p", "h": "自分の手のひらは、何も覚えていなかった。けれど、湯気の向こうの小さな背中は、もう消えなかった。"}, {"t": "opener", "i": 6, "alt": "第六章　足りない一本", "lead": "十日目の朝、窓ぎわで、かずまはいつものように、よしゆきの押しやったトレイを食べていた。"}, {"t": "p", "h": "十日目の朝、窓ぎわで、かずまはいつものように、よしゆきの押しやったトレイを食べていた。向かいで、かくじが、自分のご飯を半分、かずまの茶碗に移していた。"}, {"t": "p", "h": "入り口のほうに、ヤマが立っていた。前髪が目にかかるほど伸びていて、くたびれた上着に、乾いた白いしみが点々とついていた。"}, {"t": "p", "h": "ヤマは、テーブルのあいだを通って、こちらへ歩いてきた。足音はしなかった。かずまの前で、止まった。"}, {"t": "p", "h": "「お返ししておきました。一年分」"}, {"t": "p", "h": "かずまが、箸を止めて、ヤマを見上げた。"}, {"t": "p", "h": "「……は？」"}, {"t": "p", "h": "「券ですよ。かずまさんの」"}, {"t": "p", "h": "「……なんでだよ」"}, {"t": "p", "h": "「かずまさんには、元気でいてもらわないと」"}, {"t": "p", "h": "ヤマは、片方の口角だけを上げた。かずまは、何か言いかえそうとして、やめた。席を立って、入り口の機械のほうへ歩いていった。"}, {"t": "p", "h": "上着のポケットから、自分の券を出して、かざした。白い光が、一度だけまたたいた。トレイが一枚、せり出してきた。"}, {"t": "p", "h": "かずまは、それをしばらく見下ろしていた。"}, {"t": "p", "h": "「……通った」"}, {"t": "p", "h": "小さな声だった。"}, {"t": "p", "h": "ヤマは、入り口の機械の前に立つかずまの背中を、見ていた。それから、よしゆきのほうへ、少しだけ顔を寄せた。"}, {"t": "p", "h": "「それと、<span class=\"up\">919</span>さん」"}, {"t": "p", "h": "小さな声だった。"}, {"t": "p", "h": "「<span class=\"up\">920</span>さんの瓶が、一本たりないんです」"}, {"t": "p", "h": "よしゆきは、動かなかった。"}, {"t": "p", "h": "流しの下の戸棚の奥に、一本、しまってあった。"}, {"t": "p", "h": "「数が、合わないんですよ」"}, {"t": "p", "h": "ヤマは、それだけ言って、顔を離した。返却口のそばで、トレイを重ねる灰色の作業着の列を、ちらりと見た。"}, {"t": "p", "h": "<span class=\"up\">920</span>さん。"}, {"t": "p", "h": "ヤマの目が、入り口の機械の前に立っている、寝ぐせの頭に止まっていた。"}, {"t": "p", "h": "かずまさんには、元気でいてもらわないと。"}, {"t": "p", "h": "よしゆきは、向かいのかくじを見た。"}, {"t": "p", "h": "かくじは、黙っていた。目を、丸く見開いていた。それから、口をすぼめて、少し横に寄せた。何も言っていないのに、言いきったあとの顔をしていた。"}, {"t": "p", "h": "「では、また」"}, {"t": "p", "h": "ヤマは、入り口のほうへ戻っていった。"}, {"t": "p", "h": "かずまが、新しいトレイを持って戻ってきた。"}, {"t": "p", "h": "「何話してたんだよ」"}, {"t": "p", "h": "「……別に」"}, {"t": "p", "h": "よしゆきは、それしか言えなかった。"}, {"t": "p", "h": "かくじは、自分の茶碗に残ったご飯を、また半分、かずまの新しい茶碗に移した。券が戻っても、そうした。"}, {"t": "p", "h": "「おっちゃん。俺、もう券あるって」"}, {"t": "p", "h": "「知ってるよ」"}, {"t": "p", "h": "かくじは、それ以上は言わなかった。"}, {"t": "p", "h": "よしゆきは、窓の外を見た。"}, {"t": "p", "h": "戸棚の奥の一本のことは、言わなかった。かずまにも、かくじにも。"}, {"t": "opener", "i": 7, "alt": "第七章　明かりの下の紙", "lead": "それから何日か、かくじは、夜になると、別の話をした。"}, {"t": "p", "h": "それから何日か、かくじは、夜になると、別の話をした。"}, {"t": "p", "h": "配給所の坂のふちに、三人で腰かける。かくじは、手すりの柱を一本はさんで座る。それから、話しはじめる。"}, {"t": "p", "h": "「ある晩な、釜の火がつかなくなったんだよ。明日の朝の分、炊けねえ。どうしようもねえ。そしたら、ちっちぇえのが来てよ」"}, {"t": "p", "h": "かくじは、顎でよしゆきをさした。"}, {"t": "p", "h": "「ねじ回し持って、釜の下にもぐりこんで、ねじ外して、つけちまったんだよ。火を。こんなちっちぇえ手で」"}, {"t": "p", "h": "かずまは、何度聞いても、そこで笑った。"}, {"t": "p", "h": "同じ話を聞くのは、五度目だった。"}, {"t": "p", "h": "釜の下は、暗かった。"}, {"t": "p", "h": "板を外すと、焦げたにおいがした。ねじの頭が、四つ並んでいた。小さな自分の指が、それを一つずつ回していく。手は、考えるより先に動いた。"}, {"t": "p", "h": "つまみを回すと、青い火が、輪になってついた。"}, {"t": "p", "h": "釜の下から這いだすと、大きな手が、親指を立てていた。"}, {"t": "p", "h": "炊事場の明かりが、天井から一つだけ下がっていた。黄色い、弱い明かりだった。"}, {"t": "p", "h": "その明かりの下に、机があった。"}, {"t": "p", "h": "かくじが、机に向かって座っていた。大きな背中が、少し丸まっていた。手に、短い鉛筆を握っていた。"}, {"t": "p", "h": "紙に、何か書いていた。"}, {"t": "p", "h": "一行書いては、指で紙を押さえて、次の行を書く。紙には、名前が並んでいた。"}, {"t": "p", "h": "窓の外に、門が見えた。門の外に、白い車が一台、止まっていた。音もなく、においもしなかった。"}, {"t": "p", "h": "廊下を、一人の子が歩いていった。小さな鞄を、一つだけ持っていた。ふちの細い、銀色の丸い眼鏡をかけていた。その子は、門の前で立ちどまった。白い車を見上げて、頭を掻いた。それから、うしろを振りかえった。誰も、いなかった。炊事場の明かりが、眼鏡に光った。"}, {"t": "p", "h": "それから、白い車に乗った。"}, {"t": "p", "h": "車は、音もなく動きだした。"}, {"t": "p", "h": "机の前で、かくじが、紙の名前を、小さな声で読みあげていた。誰かに聞かせるように。一つずつ、区切って。"}, {"t": "p", "h": "その中に、よしゆき、という名前があった。"}, {"t": "p", "h": "よしゆきは、坂のふちで、手すりの柱を握っていた。"}, {"t": "p", "h": "かくじは、まだ話していた。釜の火の夜の話を、いつもの声で。親指を立てるところまで、話していた。"}, {"t": "p", "h": "かずまが、笑っていた。"}, {"t": "p", "h": "眼鏡の子の顔が、目の奥に残っていた。"}, {"t": "p", "h": "あの子の名前は、かずまの口から、一度も出てこなかった。とおるも、ゆうやも、なおきも出てきた。あの子の名前だけは、出てこなかった。"}, {"t": "p", "h": "かずまも、覚えていないのだ。"}, {"t": "p", "h": "誰も、覚えていなかった子だった。"}, {"t": "p", "h": "よしゆきは、柱から手を離した。手のひらに、柱の冷たさが残っていた。"}, {"t": "p", "h": "かくじが、話を終えて、親指を立てた。"}, {"t": "p", "h": "よしゆきは、その親指を見なかった。かくじの、もう一方の手を見ていた。膝の上に置かれた、大きな手。指が太くて、爪のあいだが黒かった。"}, {"t": "p", "h": "あの夜、鉛筆を握っていた手だった。"}, {"t": "opener", "i": 8, "alt": "第八章　とっといた名前", "lead": "次の夜、よしゆきは、一人で町はずれの古い建物へ行った。"}, {"t": "p", "h": "次の夜、よしゆきは、一人で町はずれの古い建物へ行った。いちばん奥の戸を、叩かずに開けた。"}, {"t": "p", "h": "かくじは、部屋の明かりもつけずに、窓のそばに座っていた。七輪の火は、落ちていた。小さな釜が、冷えたまま、壁ぎわにあった。"}, {"t": "p", "h": "よしゆきは、戸口に立ったまま言った。"}, {"t": "p", "h": "「紙に、名前、書いてたろ」"}, {"t": "p", "h": "かくじは、振りかえらなかった。"}, {"t": "p", "h": "「炊事場の明かりの下で。夜に。門の外に、白い車が止まってた」"}, {"t": "p", "h": "窓の外を見たまま、かくじは、しばらく黙っていた。"}, {"t": "p", "h": "「書いたよ。お前の名前も」"}, {"t": "p", "h": "うそをつく間も、言いわけをする間も、なかった。言いきって、かくじは、目を丸く見開き、口をすぼめて、少し横に寄せた。"}, {"t": "p", "h": "よしゆきは、戸口の柱をつかんだ。"}, {"t": "p", "h": "「なんでだよ」"}, {"t": "p", "h": "「炊事場、焼け野原にしねえためだよ」"}, {"t": "p", "h": "かくじは、自分の手のひらを見た。"}, {"t": "p", "h": "「名前出しゃ、配給は減らされねえ。ガキどもの飯が、守れる。そういう約束だった」"}, {"t": "p", "h": "「……順番に、連れてったのかよ」"}, {"t": "p", "h": "「上から順に、一人ずつだよ。何年もかけてな」"}, {"t": "p", "h": "かくじは、指を一本ずつ折るまねをして、途中でやめた。"}, {"t": "p", "h": "「お前の番が、今来たんだよ。お前で、終わりじゃねえよ」"}, {"t": "p", "h": "よしゆきは、何も言えなかった。"}, {"t": "p", "h": "「誰も覚えてねえ子から、出すんだよ。迎えに来るやつも、名前呼ぶやつもいねえ子から。いなくなっても、誰も気づかねえから」"}, {"t": "p", "h": "かくじは、よしゆきのほうを見た。"}, {"t": "p", "h": "「お前は、一人だったろ。炊事場の列の、いちばん前に、いつも一人で並んでた。だから、書いた」"}, {"t": "p", "h": "「……かずまは」"}, {"t": "p", "h": "声が、かすれた。"}, {"t": "p", "h": "「かずまの名前は、なかった。紙に」"}, {"t": "p", "h": "「かばってねえよ」"}, {"t": "p", "h": "かくじは、すぐに言った。"}, {"t": "p", "h": "「とっといたんだよ」"}, {"t": "p", "h": "よしゆきは、意味が分からなかった。かくじは、相場を読むような声で、続けた。"}, {"t": "p", "h": "「かずまはな、数えきれねえんだよ。名前呼ぶやつが。あいつのこと覚えてるやつが、寮じゅうにいた。そういうのは、すぐには出さねえ。値が上がるの、待つんだよ」"}, {"t": "p", "h": "「……値」"}, {"t": "p", "h": "「覚えられてるやつほど、瓶飲ませても、人のまま残る。向こうは、そう見てる。だから、いちばん最後まで、とっとく」"}, {"t": "p", "h": "よしゆきは、柱をつかんだ手に、力が入るのを感じた。"}, {"t": "p", "h": "かずまは、守られていたのではなかった。とっておかれていた。"}, {"t": "p", "h": "自分のほうが先に、使われた。かずまのほうが、値打ちがあったから。"}, {"t": "p", "h": "「読みちがえたんだよ、俺」"}, {"t": "p", "h": "かくじが、ぽつりと言った。"}, {"t": "p", "h": "「お前、一人じゃなかった。毎朝、遅れてくるやつがいた。『おせーよ』って言う相手がいた。見てたのにな。数え方、まちがえた」"}, {"t": "p", "h": "かくじは、冷えた釜を見た。"}, {"t": "p", "h": "「張るたびに、外してんだよ、俺」"}, {"t": "p", "h": "軽口の形をしていた。けれど、かくじは笑わなかった。"}, {"t": "p", "h": "よしゆきは、柱から手を離した。"}, {"t": "p", "h": "何か言いかえそうとした。殴ってやろうか、とも思った。けれど、手は、柱の冷たさを握ったまま、下りていった。"}, {"t": "p", "h": "「……帰る」"}, {"t": "p", "h": "それだけ言って、戸に手をかけた。閉める前に、もう一度だけ、部屋の中を見た。"}, {"t": "p", "h": "かくじの背中は、もう窓のほうを向いていた。"}, {"t": "opener", "i": 9, "alt": "第九章　蹴られた手すり", "lead": "次の朝、よしゆきは、かずまが来る前に、食堂の外で待っていた。"}, {"t": "p", "h": "次の朝、よしゆきは、かずまが来る前に、食堂の外で待っていた。"}, {"t": "p", "h": "寝ぐせの頭が、角を曲がって歩いてきた。よしゆきを見て、足を止めた。"}, {"t": "p", "h": "「なんだよ。中で待ってりゃいいのに」"}, {"t": "p", "h": "「話がある」"}, {"t": "p", "h": "二人で、入り口の横の坂のふちに腰かけた。手すりの柱が、朝の光で冷たく光っていた。"}, {"t": "p", "h": "よしゆきは、戻ってきた記憶のことを話した。炊事場の明かり。机に向かう大きな背中。紙に並んだ名前。門の外の白い車。読みあげられた、自分の名前。"}, {"t": "p", "h": "かずまの名前がなかった訳は、言わなかった。"}, {"t": "p", "h": "かずまは、途中から、何も言わなくなった。膝の上で、両手を組んでいた。人差し指は、頬に当たらなかった。天井も、空も見なかった。組んだ手だけを、見ていた。"}, {"t": "p", "h": "「……おっちゃんが、書いたのかよ」"}, {"t": "p", "h": "「書いたって、言ってた」"}, {"t": "p", "h": "「お前の名前もか」"}, {"t": "p", "h": "「俺の名前も」"}, {"t": "p", "h": "かずまは、しばらく黙っていた。それから、立ちあがった。"}, {"t": "p", "h": "「は？」"}, {"t": "p", "h": "誰に言ったのでもなかった。手すりを、一度だけ蹴った。鈍い音がした。"}, {"t": "p", "h": "「ふざけんなよ。毎朝、飯分けてたじゃねえか。親指、立ててたじゃねえか」"}, {"t": "p", "h": "声が、だんだん大きくなった。列に並んでいた何人かが、こちらを見た。"}, {"t": "p", "h": "「全部、知っててやってたのかよ。お前の顔見ながら」"}, {"t": "p", "h": "よしゆきは、答えなかった。答えを、持っていなかった。"}, {"t": "p", "h": "かずまは、手すりを握ったまま、肩で息をしていた。それから、入り口のほうを見た。"}, {"t": "p", "h": "列の前のほうに、がっしりした背中が並んでいた。両わきを刈りあげた頭が、ほかの頭より一つ高かった。"}, {"t": "p", "h": "かずまは、その背中から目をそらした。"}, {"t": "p", "h": "「……今日、飯いいわ。配達、先行く」"}, {"t": "p", "h": "それだけ言って、配達の鞄を肩にかけなおし、歩いていった。食堂には、入らなかった。"}, {"t": "p", "h": "よしゆきは、坂のふちに一人で座っていた。"}, {"t": "p", "h": "腹が立つはずだった。自分の名前を、紙に書いた男だ。白い車に、自分を乗せる順番を決めた男だ。"}, {"t": "p", "h": "けれど、怒りは、どこかで止まった。最後まで、のぼってこなかった。"}, {"t": "p", "h": "かわりに、においが来た。濡れた木と、熱い鉄のにおい。釜のふたのふちをつかむ、太い指。湯気の向こうの、小さな背中。おせーよ、と言う自分の声。"}, {"t": "p", "h": "全部、あの男が、返してくれたものだった。"}, {"t": "p", "h": "よしゆきは、自分の手のひらを見た。"}, {"t": "p", "h": "殴れなかった手だった。"}, {"t": "p", "h": "入り口の機械が、白い光を一度だけまたたかせた。トレイを受けとった大きな背中が、窓ぎわのいつもの席へ歩いていった。"}, {"t": "p", "h": "その向かいには、誰も座らなかった。"}, {"t": "opener", "i": 10, "alt": "第十章　二つの名前", "lead": "その日の夕方、よしゆきは、自分から食堂の裏の細い道へ行った。"}, {"t": "p", "h": "その日の夕方、よしゆきは、自分から食堂の裏の細い道へ行った。"}, {"t": "p", "h": "閉まったシャッターの前に、ヤマがしゃがんでいた。待っていたのか、たまたまいたのか、分からなかった。"}, {"t": "p", "h": "「<span class=\"up\">920</span>って、かずまのかよ」"}, {"t": "p", "h": "よしゆきは、立ったまま言った。ヤマは、しゃがんだまま、よしゆきを見上げた。片方の口角が、ゆっくり上がった。"}, {"t": "p", "h": "「そうですよ。<span class=\"up\">919</span>さんで、うまくいきましたから。次は、とっておいた方からです」"}, {"t": "p", "h": "ヤマは立ちあがって、端末を顔の高さにかまえた。赤い光が、一度だけまたたいた。"}, {"t": "p", "h": "「上がってますね」"}, {"t": "p", "h": "ヤマは、画面から目を離さなかった。"}, {"t": "p", "h": "「かくじさんが来てから、ずっとです。同じ話を、毎日聞いてるんでしょう」"}, {"t": "p", "h": "よしゆきは、答えなかった。"}, {"t": "p", "h": "「なんででしょうね、って、前に言いましたよね」"}, {"t": "p", "h": "ヤマは、片方の口角を上げた。"}, {"t": "p", "h": "「あのときは、本当に分からなかったんです。今は、少し分かります。毎朝、同じことを言いあう人がいた。それから、同じ話をくり返してくれる人が来た。そのたびに、数字が上がる」"}, {"t": "p", "h": "ヤマは、端末を下ろした。"}, {"t": "p", "h": "「施設の先輩たちにも、試してみたいんです」"}, {"t": "p", "h": "「……試す」"}, {"t": "p", "h": "「かくじさんに、施設に来てもらいます。先輩たちに、昔の話を、毎日してもらう。先輩たちの中には、かくじさんの寮の子が、何人もいますから」"}, {"t": "p", "h": "よしゆきの手が、上着の裾を握った。"}, {"t": "p", "h": "「それで、先輩たちの数字が上がれば、これから選ばれる人も、同じやり方で守れる。うまくいかなくても、記録はとれます」"}, {"t": "p", "h": "「……かくじは、行くって言ってんのかよ」"}, {"t": "p", "h": "「まだ、聞いていません。<span class=\"up\">919</span>さんに、先に聞こうと思って」"}, {"t": "p", "h": "ヤマは、首をかしげた。"}, {"t": "p", "h": "「かくじさんが来てくれれば、かずまさんに、<span class=\"up\">920</span>を使わずに済みます」"}, {"t": "p", "h": "よしゆきは、顔を上げた。"}, {"t": "p", "h": "「かずまさんは、<span class=\"up\">919</span>さんのそばにいてもらうほうが、大事ですから。<span class=\"up\">919</span>さんの数字を、支えてる人ですから。わざわざ、瓶を飲ませる必要が、なくなります」"}, {"t": "p", "h": "ヤマの声は、明日の天気を話すような声だった。"}, {"t": "p", "h": "「新しい記録が、要るんです。かくじさんが来てくれれば、先輩たちで、新しい記録がとれます。瓶は、もう要りません。来なければ、かずまさんに<span class=\"up\">920</span>を飲んでもらって、とるしかありません。<span class=\"up\">920</span>は、予定どおりです」"}, {"t": "p", "h": "戸棚の奥の一本が、頭に浮かんだ。透明な瓶。白いラベル。番号だけ。"}, {"t": "p", "h": "「……なんで、俺に聞くんだよ」"}, {"t": "p", "h": "「<span class=\"up\">919</span>さんの数字を上げた人ですから」"}, {"t": "p", "h": "ヤマは、端末を上着のポケットにしまった。"}, {"t": "p", "h": "「<span class=\"up\">919</span>さんに、決めてもらいます。かくじさんを出すか。かずまさんを出すか」"}, {"t": "p", "h": "「出すって、なんだよ。物みてえに」"}, {"t": "p", "h": "「物じゃありませんよ。大事な人です。だから、決めてもらうんです」"}, {"t": "p", "h": "ヤマは、片方の口角を上げたまま、少しだけ顔を寄せた。"}, {"t": "p", "h": "「三日後の夕方、ここに白い車が来ます。それまでに」"}, {"t": "p", "h": "それから、いつもの顔になった。"}, {"t": "p", "h": "「<span class=\"up\">919</span>さん。どんな気持ち？」"}, {"t": "p", "h": "よしゆきは、答えなかった。"}, {"t": "p", "h": "ヤマは、答えを待たずに、画面に何か打ちこんだ。打ちこみおえてから、口角を下ろした。"}, {"t": "p", "h": "「では、また」"}, {"t": "p", "h": "足音はしなかった。ヤマは、通りの明かりの外へ歩いていった。"}, {"t": "p", "h": "よしゆきは、シャッターの前に立ったまま、動けなかった。"}, {"t": "p", "h": "かくじか。かずまか。"}, {"t": "p", "h": "どちらの名前も、口に出せなかった。"}, {"t": "opener", "i": 11, "alt": "第十一章　張るなら", "lead": "三日目の朝、よしゆきは、流しの下の戸棚を開けた。"}, {"t": "p", "h": "三日目の朝、よしゆきは、流しの下の戸棚を開けた。"}, {"t": "p", "h": "奥から、番号だけの瓶を出した。ふだんは、持ち歩かない一本だった。今日だけは、上着のポケットに入れて出た。いつもの瓶と並んで、二本が、歩くたびに小さく鳴った。"}, {"t": "p", "h": "かずまは、その日も、食堂に来なかった。"}, {"t": "p", "h": "夕方、食堂の裏の細い道へ行くと、かくじが先に来ていた。閉まったシャッターに背中をあずけて、腕を組んでいた。"}, {"t": "p", "h": "「聞いたよ。あいつから」"}, {"t": "p", "h": "かくじは、よしゆきを見ずに言った。"}, {"t": "p", "h": "「今日の夕方に、白い車。俺か、かずまか、だろ」"}, {"t": "p", "h": "よしゆきは、答えなかった。かくじの隣に、少し離れて立った。"}, {"t": "p", "h": "「炊事場な」"}, {"t": "p", "h": "かくじが、言った。"}, {"t": "p", "h": "「あれから、何年かして、なくなったんだよ。配給、減らされてな。釜、三つとも持ってかれた」"}, {"t": "p", "h": "「……名前、出したのにかよ」"}, {"t": "p", "h": "「出したのにだよ。張ったのに、炊事場ごと持ってかれた。最初から、負けてたんだよ」"}, {"t": "p", "h": "かくじは、自分の手のひらを見た。"}, {"t": "p", "h": "「張るたびに、外してんだよ、俺」"}, {"t": "p", "h": "軽口の形をしていた。かくじは、やっぱり笑わなかった。"}, {"t": "p", "h": "それから、かくじは、話しはじめた。湯気の話でも、釜の火の話でもなかった。"}, {"t": "p", "h": "「炊事場の前に、列ができんだよ。いちばん前は、毎朝お前だ」"}, {"t": "p", "h": "同じ話を聞くのは、五度目だった。"}, {"t": "p", "h": "寒い廊下だった。"}, {"t": "p", "h": "炊事場の戸の前に、自分が並んでいた。いちばん前。息が白かった。うしろには、まだ誰もいなかった。"}, {"t": "p", "h": "戸の向こうで、釜のふたが上がる音がした。湯気が、戸のすきまから廊下に流れてきた。濡れた木と、熱い鉄のにおい。"}, {"t": "p", "h": "廊下の向こうから、ばたばたと足音が来た。寝ぐせの頭が、列の横を走ってくる。息を切らせて、自分のうしろに並ぶ。"}, {"t": "p", "h": "おせーよ。"}, {"t": "p", "h": "小さな自分が、言った。"}, {"t": "p", "h": "お前が早すぎんだよ。"}, {"t": "p", "h": "小さなかずまが、言いかえした。"}, {"t": "p", "h": "戸が開いた。大きな男が、湯気の中から顔を出した。二人を見下ろして、笑った。言葉より先に、親指を立てた。"}, {"t": "p", "h": "検証だろ。"}, {"t": "p", "h": "それが、はじまりだった。毎朝の、あの言い合いの。"}, {"t": "p", "h": "よしゆきは、隣を見た。同じ顔の男が立っていた。何年もたって、もう笑わなくなった顔。"}, {"t": "p", "h": "通りの向こうから、白い車が来た。"}, {"t": "p", "h": "音もなく、においもしなかった。車は、細い道の入り口に止まった。"}, {"t": "p", "h": "運転席から、誰も降りてこなかった。助手席の戸が開いて、ヤマが降りてきた。"}, {"t": "p", "h": "かくじは、白い車を見ていた。"}, {"t": "p", "h": "「寮、まだ回ってんだよ」"}, {"t": "p", "h": "ぽつりと言った。誰に言ったのでもなかった。"}, {"t": "p", "h": "「炊事場がなくなっても、寮はある。ガキどもも、いる。誰が名前書いてんだか、今は」"}, {"t": "p", "h": "ヤマが、二人の前で止まった。"}, {"t": "p", "h": "「お二人そろって。話が早くて、助かります」"}, {"t": "p", "h": "ヤマは、端末を出さなかった。よしゆきだけを見ていた。"}, {"t": "p", "h": "「<span class=\"up\">919</span>さん。決めてもらえましたか」"}, {"t": "p", "h": "よしゆきは、口を開けた。声が、出てこなかった。"}, {"t": "p", "h": "かくじが、シャッターから背中を離した。"}, {"t": "p", "h": "「張るなら、俺だろ」"}, {"t": "p", "h": "言いきって、かくじは、目を丸く見開き、口をすぼめて、少し横に寄せた。いつもの顔だった。"}, {"t": "p", "h": "「かずまに張るやつがいるかよ。あいつは、まだ値が上がる。俺は、もう底だ」"}, {"t": "p", "h": "よしゆきは、かくじを見た。"}, {"t": "p", "h": "かくじは、よしゆきを見ていなかった。白い車を見ていた。"}, {"t": "p", "h": "「……かくじを」"}, {"t": "p", "h": "声が、自分のものではないように聞こえた。"}, {"t": "p", "h": "「かくじを、出す」"}, {"t": "p", "h": "ヤマは、うなずいた。"}, {"t": "p", "h": "よしゆきは、上着のポケットに手を入れた。番号だけの瓶を出した。透明な瓶に、透明な中身。白いラベルに、<span class=\"up\">920</span>。"}, {"t": "p", "h": "それを、ヤマの手に置いた。"}, {"t": "p", "h": "ヤマは、瓶を見た。少しだけ、眉が上がった。"}, {"t": "p", "h": "「そちらに、ありましたか」"}, {"t": "p", "h": "それ以上は、聞かなかった。端末も、見なかった。瓶を割りもしなかった。ヤマは、それを自分の胸のポケットに、そっとしまった。"}, {"t": "p", "h": "かくじが、白い車のほうへ歩きだした。"}, {"t": "p", "h": "二、三歩行って、振りかえった。よしゆきを見た。"}, {"t": "p", "h": "何も言わなかった。言葉より先に、親指が立った。"}, {"t": "p", "h": "よしゆきは、手をのばした。かくじの肩に、手が届いた。"}, {"t": "p", "h": "かくじは、よけなかった。触れかえしもしなかった。ただ、肩に置かれた手の重さを、しばらくそのままにしていた。"}, {"t": "p", "h": "それから、耳にはさんでいた短い鉛筆を外して、シャッターの前に置いた。"}, {"t": "p", "h": "車に乗った。"}, {"t": "p", "h": "戸が閉まった。白い車は、音もなく動きだして、角を曲がった。"}, {"t": "p", "h": "足音が、聞こえた。"}, {"t": "p", "h": "配達の鞄をかけたかずまが、道の角を走ってきた。肩で息をしていた。"}, {"t": "p", "h": "角の向こうには、もう何もなかった。"}, {"t": "p", "h": "かずまは、そこで足を止めた。それから、よしゆきを見た。"}, {"t": "p", "h": "よしゆきは、まだ、手をのばした形のまま立っていた。"}, {"t": "opener", "i": 12, "alt": "第十二章　少し大きな釜", "lead": "それから何日か、かずまは、朝の食堂に来た。"}, {"t": "p", "h": "それから何日か、かずまは、朝の食堂に来た。"}, {"t": "p", "h": "隣に座って、よしゆきの押しやったトレイを、黙って食べた。「おせーよ」には、「お前が早すぎんだよ」と返した。それだけだった。"}, {"t": "p", "h": "かくじの話は、しなかった。窓ぎわの、かくじの座っていた席のほうを、一度も見なかった。"}, {"t": "p", "h": "その週の終わりの夜、ドアの前に、紙袋が置いてあった。七本の瓶が、きっちり並んでいた。番号だけの瓶は、まじっていなかった。"}, {"t": "p", "h": "よしゆきは、気づいていた。"}, {"t": "p", "h": "釜のふたを持ちあげる、大きな手。その手の指の太さが、うすくなっていた。爪のあいだの黒さも、もう思いだせなかった。湯気のにおいは、まだあった。けれど、手の形が、湯気の中に溶けていくようだった。"}, {"t": "p", "h": "釜の火の夜も、ねじの頭が四つ並んでいたことしか、残っていなかった。"}, {"t": "p", "h": "おせーよ、のほうは、残っていた。毎朝、言っているからだった。"}, {"t": "p", "h": "五日目の朝だった。"}, {"t": "p", "h": "かずまが、煮豆を一粒、口に放りこんだ。噛みながら、窓の外を見て、ぽつりと言った。"}, {"t": "p", "h": "「おっちゃんの手、でかかったよな」"}, {"t": "p", "h": "よしゆきは、うなずこうとした。"}, {"t": "p", "h": "首が、動かなかった。でかかった、という言葉は分かった。けれど、どれくらいでかかったのか。どんな指だったのか。もう、手のほうから、浮かんでこなかった。"}, {"t": "p", "h": "かずまが、こちらを見た。"}, {"t": "p", "h": "よしゆきの顔を、しばらく見ていた。それから、箸を置いた。"}, {"t": "p", "h": "「……お前」"}, {"t": "p", "h": "かずまは、何か言いかけて、やめた。眉のあいだに、しわが寄った。怒った顔だった。怒った顔のまま、話しはじめた。"}, {"t": "p", "h": "「寮の炊事場な。朝、まだ暗えうちに、釜に火入れんだよ。でかい釜が三つあって」"}, {"t": "p", "h": "かくじの言い方とは、少しちがった。かずまの話す釜は、かくじの話す釜より、少し大きかった。湯気も、少し多かった。"}, {"t": "p", "h": "「ふた上げたら、湯気がぶわっと出て、前がなんにも見えなくなんだよ。おっちゃんの手、こんなでかくてさ」"}, {"t": "p", "h": "かずまは、自分の手を広げてみせた。それから、指を一本ずつ、もっと太く見せるように、折りまげた。"}, {"t": "p", "h": "「忘れんなよ」"}, {"t": "p", "h": "かずまは、トレイをよしゆきのほうへ押しもどした。"}, {"t": "p", "h": "「あんなやつでも」"}, {"t": "p", "h": "その日から、毎朝、かずまは、かくじの話をした。怒った顔のまま。湯気の話、列の話、釜の火の話。かくじの話す話とは、少しずつちがう形で。"}, {"t": "p", "h": "夕方、配給所の坂のふちに、二人で腰かけていると、ヤマが来た。"}, {"t": "p", "h": "足音はしなかった。気づいたときには、坂の下に立っていた。端末を、よしゆきの顔の高さにかまえた。赤い光が、一度だけまたたいた。"}, {"t": "p", "h": "「下がりかけて、止まりました」"}, {"t": "p", "h": "ヤマは、画面から目を上げた。かずまを見た。"}, {"t": "p", "h": "「かずまさんの、おかげですね」"}, {"t": "p", "h": "かずまは、ヤマをにらんだ。"}, {"t": "p", "h": "「何がだよ」"}, {"t": "p", "h": "「<span class=\"up\">920</span>、使わずに済みました」"}, {"t": "p", "h": "ヤマは、片方の口角を上げた。"}, {"t": "p", "h": "「かずまさんの瓶だったんですよ。九百二十人目の」"}, {"t": "p", "h": "かずまの手が、膝の上で止まった。"}, {"t": "p", "h": "「<span class=\"up\">919</span>さんが、かくじさんを出して、かずまさんを残したんです」"}, {"t": "p", "h": "ヤマは、片方の口角を上げたまま、かずまの顔をのぞきこんだ。"}, {"t": "p", "h": "「かずまさん。どんな気持ち？」"}, {"t": "p", "h": "かずまは、答えなかった。ヤマは、答えを待たずに、端末をしまった。"}, {"t": "p", "h": "「では、また」"}, {"t": "p", "h": "ヤマは、坂を下りて、通りの明かりの外へ歩いていった。くたびれた上着の胸のポケットが、細い瓶の形に、少しだけふくらんでいた。足音は、最後までしなかった。"}, {"t": "p", "h": "かずまは、動かなかった。"}, {"t": "p", "h": "「……は？」"}, {"t": "p", "h": "それから、よしゆきを見た。"}, {"t": "p", "h": "よしゆきは、答えなかった。手すりの柱を、見ていた。かくじが、いつも一本はさんで座っていた柱だった。"}, {"t": "p", "h": "かずまは、それ以上、何も聞かなかった。"}, {"t": "p", "h": "二人は、坂のふちに並んだまま、暗くなるまで、そこにいた。"}, {"t": "p", "h": "寮、まだ回ってんだよ。誰が名前書いてんだか、今は。"}, {"t": "p", "h": "白い車を見ながら言った、かくじの声が、耳の奥に残っていた。"}, {"t": "opener", "i": 13, "alt": "終章　くり返す朝", "lead": "朝の七時、共同の食堂には、もう長い列ができていた。"}, {"t": "p", "h": "朝の七時、共同の食堂には、もう長い列ができていた。"}, {"t": "p", "h": "よしゆきは列の後ろに並んで、入り口の機械に配給券をかざした。白い光が一度だけまたたいて、トレイが一枚せり出してくる。"}, {"t": "p", "h": "窓ぎわの長いテーブルの、いつもの席に、寝ぐせの頭が座っていた。"}, {"t": "p", "h": "あれから、十日がたっていた。かずまは、毎朝、よしゆきより先に来て、席をとっていた。"}, {"t": "p", "h": "「おせーよ」"}, {"t": "p", "h": "「……お前が早すぎんだよ」"}, {"t": "p", "h": "かずまの前には、もう自分のトレイがあった。よしゆきは、自分のトレイを、その横へ押しやった。かずまは、黙ってそれも引きよせた。"}, {"t": "p", "h": "あの夕方のことは、どちらも口にしなかった。"}, {"t": "p", "h": "かずまは、怒った顔のまま、話しはじめた。"}, {"t": "p", "h": "「寮の炊事場な。朝、まだ暗えうちに、釜に火入れんだよ」"}, {"t": "p", "h": "毎朝の話だった。かずまの話す釜は、かくじの話した釜より、少し大きかった。それでも、ふたを上げると、においが来た。濡れた木と、熱い鉄のにおい。うすれかけていたのが、また鼻の奥に戻ってきた。"}, {"t": "p", "h": "話しおえると、かずまは、人差し指を頬に当てて、天井を見た。"}, {"t": "p", "h": "「なあ、豆とご飯、どっちが腹にたまると思う。俺はご飯に賭ける」"}, {"t": "p", "h": "「検証だろ」"}, {"t": "p", "h": "かずまの手が、止まった。それから、怒った顔のまま、口の端だけが、先に笑った。"}, {"t": "p", "h": "「……おっちゃんの、だろ。それ」"}, {"t": "p", "h": "かずまは茶碗のご飯をかきこんで、配達の鞄を肩にかけた。出口で一度振りかえり、片手を上げて、出ていった。"}, {"t": "p", "h": "よしゆきは、空になったトレイを二枚重ねて、返却口まで持っていった。"}, {"t": "p", "h": "灰色の作業着の手が、黙ってそれを受けとった。ほかの手は、みな同じ速さで、トレイを重ねていた。"}, {"t": "p", "h": "その手だけが、一度だけ、止まった。トレイを置いて、自分の頭を掻いた。それから、また、同じ速さで重ねはじめた。"}, {"t": "p", "h": "よしゆきは、顔を上げた。"}, {"t": "p", "h": "いつもの配膳係の一人だった。前に、ときどき、よしゆきのほうを見ていた男だった。顎の下に、うすいひげが、まっすぐのびていた。胸のポケットの瓶のラベルは、<span class=\"up\">525</span>だった。"}, {"t": "p", "h": "その顔に、あの夜、寮の門の前で、白い車を見上げて頭を掻いていた子の顔が、重なって見えた。眼鏡は、どこにもなかった。"}, {"t": "p", "h": "よしゆきは、返却口の前から、動かなかった。"}, {"t": "p", "h": "「寮の炊事場な」"}, {"t": "p", "h": "口から、言葉が出た。"}, {"t": "p", "h": "「朝、まだ暗えうちに、釜に火入れんだよ。でかい釜が三つあって。ふた上げると、湯気がぶわっと出て、前がなんにも見えなくなる」"}, {"t": "p", "h": "<span class=\"up\">525</span>の手は、同じ速さで、トレイを重ねていた。"}, {"t": "p", "h": "話しおえても、こちらを見なかった。うしろの列で、誰かが小さく舌打ちをした。"}, {"t": "p", "h": "ポケットの中で、指が、二つに折った紙に触れた。"}, {"t": "p", "h": "生きてるか。朝、席とっとく。"}, {"t": "p", "h": "何度も開いて、何度もたたんだ紙だった。折り目のところが、もう、やわらかくなっていた。"}, {"t": "p", "h": "自分には、この紙があった。おせーよ、と言えば、お前が早すぎんだよ、と返ってくる朝があった。"}, {"t": "p", "h": "この人には、なかった。"}, {"t": "p", "h": "あの夜、寮の門の前で振りかえったとき、そこには、誰もいなかった。"}, {"t": "p", "h": "寮の門の前で、今も、誰かが振りかえっているのかもしれない。"}, {"t": "p", "h": "よしゆきは、紙を握ったまま、返却口に背を向けた。"}, {"t": "p", "h": "かくじが、何べんでも話してくれた。かずまが、怒った顔のまま話してくれた。消えかけた湯気は、そのたびに、また立った。"}, {"t": "p", "h": "今度は、自分が話す番だった。"}, {"t": "p", "h": "寮へ、行く。"}, {"t": "end", "h": "了"}, {"t": "stub"}], "chapters": [{"title": "序章　入り口の男", "b": 0}, {"title": "第一章　白く抜けた戸", "b": 41}, {"title": "第二章　半分のご飯", "b": 72}, {"title": "第三章　列の話", "b": 111}, {"title": "第四章　濡れた木のにおい", "b": 150}, {"title": "第五章　欠けた釜", "b": 190}, {"title": "第六章　足りない一本", "b": 233}, {"title": "第七章　明かりの下の紙", "b": 273}, {"title": "第八章　とっといた名前", "b": 307}, {"title": "第九章　蹴られた手すり", "b": 354}, {"title": "第十章　二つの名前", "b": 388}, {"title": "第十一章　張るなら", "b": 434}, {"title": "第十二章　少し大きな釜", "b": 506}, {"title": "終章　くり返す朝", "b": 557}]};

function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener lab'; const pr=b.alt.split('\u3000'); const num=/^\d+$/.test(pr[1]||''); el.innerHTML='<span class="no">No.0919-'+String(b.i+14).padStart(2,'0')+'</span><div class="tag"><span class="n">'+pr[0]+'</span><span class="t'+(num?' dg':'')+(((pr[1]||'').length>6)?' long':'')+'">'+(pr[1]||'')+'</span></div>'; el.setAttribute('role','heading'); el.setAttribute('aria-level','2'); el.setAttribute('aria-label',b.alt.replace('\u3000',' ')); }
  else if(b.t==='stub'){ el=document.createElement('div'); el.className='opener stub'; el.innerHTML='<div class="ticket"><span class="perf" aria-hidden="true"></span><span class="k">朝の配給</span><span class="no">No.'+stubNo()+'</span><span class="d">'+stubDay()+'</span></div><button type="button" class="back">表紙へ</button>'; el.querySelector('.back').onclick=function(e){ e.stopPropagation(); idx=0; update(-1); }; }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else if(b.t==='next'){ el=document.createElement('div'); el.className='nextnav'; el.innerHTML=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

/* ---------- pagination ---------- */
function paginate(){
  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  /* NOTOCPAGE：最初の目次のページはなくし、上の帯の「目次」からだけ開く */ pages = [[{t:'cover'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'||b.t==='stub'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener' || pages[p][0].t==='stub')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

/* ---------- render ---------- */
function renderPage(hostPage, page){
  const host = hostPage.querySelector('.col');
  host.innerHTML='';
  hostPage.classList.remove('blank');
  if(!page){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='cover'){
    host.innerHTML = '<div class="opener cov" style="background:#E6EBE6"><div class="covbg t" style="background-image:url('+COVER+')"></div><div class="covbg b" style="background-image:url('+COVER+')"></div><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    setTimeout(fitCov,0);
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  /* DONEFIX2：最後のページが画面に出たら読了 */ try{
    var _vk='919:seen:'+DATA.title, _seen={}; try{ _seen=JSON.parse(localStorage.getItem(_vk)||'{}'); }catch(e){}
    visiblePages().forEach(function(p){ var ci=-1; for(var i=0;i<chapPage.length;i++){ if(chapPage[i]!=null && chapPage[i]<=p) ci=i; } if(ci>=0) _seen[ci]=1; });
    localStorage.setItem(_vk, JSON.stringify(_seen));
    var _all = DATA.chapters.every(function(c,i){ return !!_seen[i]; });
    if(last>0 && visiblePages().indexOf(last)>=0) localStorage.setItem('919:done:'+DATA.title,'1');
  }catch(e){}
  const prog = last>0 ? idx/last : 0;
  document.getElementById('liq').setAttribute('width', Math.max(0, 280*(1-prog)).toFixed(1));
  document.getElementById('finalmark').classList.toggle('show', idx===last);

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(currentBlock())); }  /* 書体が読みこまれたら、今のページの場所を保って組みなおす */
layout(null);

/* 表紙の余白を、表紙の端の色でつなぐ（上下か左右かを画面の形で判定） */
function fitCov(){
  document.querySelectorAll('.opener.cov').forEach(function(op){
    var im=op.querySelector('img'); if(!im) return;
    var set=function(){
      var W=op.clientWidth, H=op.clientHeight; if(!W||!H) return;
      var r=(im.naturalWidth||600)/(im.naturalHeight||960);
      var lr = (W/H) > r;
      op.classList.toggle('lr', lr);
    };
    if(im.complete) set(); else im.addEventListener('load', set, {once:true});
  });
}
window.addEventListener('resize', function(){ setTimeout(fitCov, 250); });

/* CHJUMP: トップページからの「章をえらぶ」 */
(function(){ var m=location.search.match(/[?&]ch=(\d+)/); if(!m) return; var c=+m[1];
  var t=function(n){ try{ if(typeof chapPage!=='undefined' && chapPage[c]){ idx=chapPage[c]; update(0); return; } }catch(e){} if(n>0) setTimeout(function(){ t(n-1); },300); };
  var go=function(){ setTimeout(function(){ t(6); },300); };  /* 書体の読みこみを待ってから章へ */
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go(); })();
/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  var _go=function(){ setTimeout(function(){ _try(6); }, 300); };  /* 書体の読みこみを待ってからしおりへ */
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(_go); else _go();
}
</script>
