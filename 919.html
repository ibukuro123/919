<style>
  :root{
    --paper:#F1F3EF;
    --paper-deep:#E1E6E1;
    --edge:#C9D1CC;
    --ink:#1F2629;
    --ink-soft:#5F6B6D;
    --pencil:#4A5A5C;
    --shu:#2F6670;
    --fs:17px;
    --lh:2.05;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#CDD5D0;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
      repeating-linear-gradient(102deg, rgba(0,0,0,.025) 0 2px, transparent 2px 5px);
    color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }
  #app{height:100dvh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  }
  .bar button{
    font:inherit;font-size:13px;letter-spacing:.14em;
    background:none;border:none;color:#3E4A4C;padding:6px 2px;cursor:pointer;
  }
  .bar button:focus-visible{outline:1.5px solid var(--shu);outline-offset:3px;}

  /* ---- ruler ---- */
  .ruler{flex:1 1 auto;display:flex;align-items:flex-end;gap:6px;height:26px;}
  .ruler .rn{font-size:11px;color:#5F6B6D;line-height:1;padding-bottom:3px;}
  .ruler svg{flex:1 1 auto;width:100%;height:100%;display:block;overflow:visible;}
  .rulerline{stroke:#5F6B6D;stroke-width:1;}
  .tick{stroke:#5F6B6D;stroke-width:1;}
  .tick.mm{stroke:#5F6B6D;opacity:.45;}
  .num{fill:#5F6B6D;font-size:9px;font-family:inherit;}
  #liq{transition:width .35s cubic-bezier(.3,.7,.3,1);}
  #mark line{stroke:var(--pencil);stroke-width:2;stroke-linecap:round;}
  #mark text{fill:var(--pencil);font-size:8.5px;letter-spacing:.06em;}
  #finalmark{opacity:0;}
  #finalmark line{stroke:var(--shu);stroke-width:2.4;stroke-linecap:round;}
  #finalmark text{fill:var(--shu);font-size:9px;}
  #finalmark.show{opacity:1;animation:printin .9s steps(6) both;}
  @keyframes printin{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}

  /* ---- book ---- */
  #book{flex:1 1 auto;position:relative;padding:0 10px 4px;min-height:0;}
  .spread{
    height:100%;display:flex;gap:0;justify-content:center;
    filter:drop-shadow(0 10px 22px rgba(30,45,44,.28));
  }
  body.vert .spread{flex-direction:row-reverse;}
  .page{
    position:relative;flex:1 1 0;min-width:0;height:100%;max-width:640px;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 12%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(110,140,136,.14), transparent 60%);
    padding:26px 20px calc(22px + env(safe-area-inset-bottom));
    overflow:hidden;
    font-size:var(--fs);line-height:var(--lh);
    letter-spacing:.03em;
    text-align:justify;
  }
  body.vert .page{writing-mode:vertical-rl;text-orientation:mixed;text-align:start;}
  .col{inline-size:var(--colw,100%);block-size:100%;margin-inline:auto;}
  .page.blank{background:var(--paper-deep);}
  #pageB{display:none;}
  body.spread #pageB{display:block;}
  body.spread #pageA{box-shadow:inset -14px 0 22px -16px rgba(50,70,68,.4);}
  body.spread #pageB{box-shadow:inset 14px 0 22px -16px rgba(50,70,68,.4);}
  body.spread.vert #pageA{box-shadow:inset 14px 0 22px -16px rgba(50,70,68,.4);}
  body.spread.vert #pageB{box-shadow:inset -14px 0 22px -16px rgba(50,70,68,.4);}

  .flip{animation:flip .26s ease;}
  @keyframes flip{from{opacity:.15;transform:translateX(var(--dx,10px));}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .flip{animation:none;} #mark{transition:none;} #finalmark.show{animation:none;}
  }

  /* ---- text blocks ---- */
  .page p{margin:0;text-indent:1em;}
  .page p + p{margin-top:0;}
  body.vert .page p{text-indent:1em;}
  .page h2{
    margin:0 0 1.6em;font-size:1.22em;font-weight:600;letter-spacing:.22em;
    line-height:1.7;text-indent:0;
  }
  body:not(.vert) .page h2{border-bottom:1px solid rgba(70,90,88,.28);padding-bottom:.5em;}
  body.vert .page h2{border-left:1px solid rgba(70,90,88,.28);padding-left:.5em;margin:0 0 1.6em 0;}
  .page blockquote{
    margin:1.2em .4em;padding:0 1em;color:#3E4A4C;font-size:.94em;
    border-left:2px solid rgba(80,110,108,.4);
  }
  body.vert .page blockquote{
    margin:.4em 1.2em;padding:1em 0;border-left:none;
    border-top:2px solid rgba(80,110,108,.4);
  }
  .sep{margin:1.5em auto;width:34%;height:0;border-top:1px solid rgba(70,90,88,.3);}
  body.vert .sep{margin:auto 1.5em;height:34%;width:0;border-top:none;border-left:1px solid rgba(70,90,88,.3);}
  .endmark{margin:2em 0 0;text-align:center;letter-spacing:.6em;color:var(--ink-soft);text-indent:0;}
  strong{font-weight:700;}
  body.vert strong{
    text-emphasis:filled dot var(--ink);-webkit-text-emphasis:filled dot var(--ink);
    font-weight:inherit;
  }
  em{font-style:normal;color:var(--ink-soft);}

  /* ---- cover ---- */
  .cover{display:flex;align-items:center;justify-content:center;height:100%;max-height:100%;}
  .cover-in{text-align:center;max-width:100%;}
  body.vert .cover-in{writing-mode:vertical-rl;height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;}
  .cover h1{
    margin:0;font-size:min(6.6vh,8.2vw,50px);font-weight:400;
    letter-spacing:.22em;line-height:1.45;text-indent:0;
  }
  body.vert .cover h1{max-height:100%;}
  .cover .sub{margin-top:1.4em;font-size:.86em;letter-spacing:.34em;color:var(--ink-soft);}
  body.vert .cover .sub{margin:1.4em 0 0;}
  .cover .pillar{margin-top:2.2em;}
  body.vert .cover .pillar{margin:2.2em 0 0;}
  .cover .pillar svg{max-height:22vh;}

  /* ---- tap zones + footer ---- */
  .zone{position:absolute;top:0;bottom:0;width:34%;border:none;background:none;cursor:pointer;padding:0;}
  .zone.l{left:0;} .zone.r{right:0;}
  .zone:focus-visible{outline:1.5px dashed var(--shu);outline-offset:-6px;}
  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 18px calc(env(safe-area-inset-bottom) + 8px);
    font-size:11.5px;letter-spacing:.14em;color:#4A5658;
  }
  .foot span{opacity:.85;}

  /* ---- sheets ---- */
  .sheet{
    position:fixed;inset:0;z-index:20;display:none;
    background:rgba(20,30,30,.45);backdrop-filter:blur(2px);
  }
  .sheet.open{display:block;}
  .sheet-in{
    position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;
    background:var(--paper);padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);
    border-radius:2px 2px 0 0;
  }
  .sheet h3{margin:0 0 16px;font-size:14px;letter-spacing:.24em;font-weight:600;color:#3E4A4C;}
  .toc-item{
    display:flex;justify-content:space-between;gap:14px;width:100%;
    font:inherit;font-size:15px;text-align:left;background:none;border:none;
    padding:11px 0;border-bottom:1px solid rgba(70,90,88,.18);color:var(--ink);cursor:pointer;
  }
  .toc-item .pg{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;flex:0 0 auto;}
  .toc-item[aria-current="true"]{color:var(--shu);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(70,90,88,.18);}
  .row:last-child{border-bottom:none;}
  .row .lab{font-size:14px;letter-spacing:.1em;}
  .seg{display:flex;border:1px solid rgba(70,90,88,.4);}
  .seg button{
    font:inherit;font-size:13px;padding:7px 15px;background:none;border:none;cursor:pointer;color:#3E4A4C;
    border-left:1px solid rgba(70,90,88,.25);
  }
  .seg button:first-child{border-left:none;}
  .seg button[aria-pressed="true"]{background:#3E4A4C;color:var(--paper);}
  .close{margin-top:20px;width:100%;font:inherit;font-size:13px;letter-spacing:.2em;padding:12px;background:none;border:1px solid rgba(70,90,88,.4);cursor:pointer;color:#3E4A4C;}

  #measure{position:fixed;top:-99999px;left:0;visibility:hidden;pointer-events:none;}

  /* ---- 電子版デザイン ---- */
  .page .opener{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#F1F3EF;writing-mode:horizontal-tb;}
  .page .opener img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .sep{display:flex;align-items:center;justify-content:center;border:none !important;margin:1.4em auto;width:auto;height:auto;}
  body.vert .sep{margin:auto 1.3em;width:auto;height:auto;}
  body:not(.vert) .sep svg{transform:rotate(-90deg);}
  body.vert .sep svg{transform:none;}

  /* ---- 目次ページ・しおり ---- */
  .bar button{white-space:nowrap;flex:0 0 auto;}
  .ruler .rn{white-space:nowrap;flex:0 0 auto;}
  .ruler{min-width:0;} .ruler svg{min-width:0;}
  .bar{gap:10px;}
  .tocpage{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:.45em;height:100%;}
  body.vert .tocpage{padding-top:0;}
  .tocpage h2{margin:0 0 .5em;border:none !important;padding:0 !important;font-size:1.05em;letter-spacing:.5em;}
  .tocpage .ti{display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:0;margin:0;color:var(--ink);cursor:pointer;text-align:start;line-height:1.3;}
  .tocpage .tb{pointer-events:auto;display:flex;align-items:center;gap:.5em;font:inherit;background:none;border:none;padding:.1em;margin:0;color:inherit;cursor:pointer;line-height:1.3;}
  .tocpage .tb:focus-visible{outline:1.5px solid var(--shu);outline-offset:2px;}
  .tocpage .tb:active .t{color:var(--shu);}
  .tocpage .ti .n{color:var(--ink-soft);font-size:.85em;letter-spacing:.2em;flex:0 0 auto;}
  .tocpage .ti .t{flex:0 1 auto;}
  .tocpage .ti .d{flex:1 1 auto;min-width:1em;min-height:1em;border:0 dotted rgba(70,90,88,.45);}
  body:not(.vert) .tocpage .ti .d{border-bottom-width:1px;}
  body.vert .tocpage .ti .d{border-left-width:1px;}
  .tocpage .ti .p{display:inline-block;writing-mode:horizontal-tb;font-size:.72em;color:var(--ink-soft);letter-spacing:.05em;flex:0 0 auto;}
  .page.marked::after{content:var(--stubno,"No.");position:absolute;top:14px;right:-6px;padding:16px 10px 12px 14px;background:#F7F6F1;border:1px solid #C9CEC9;border-right:none;box-shadow:-2px 3px 8px rgba(30,45,44,.22);writing-mode:vertical-rl;font-family:"DotGothic16",monospace;font-size:12px;letter-spacing:.12em;color:#47567E;background-image:radial-gradient(circle,#B9C2BF 1.1px,transparent 1.3px);background-size:6px 6px;background-repeat:repeat-y;background-position:3px 0;z-index:4;pointer-events:none;}
  body.spread.vert #pageB.marked::after, body.spread:not(.vert) #pageA.marked::after{right:auto;left:22px;}
  #bmBtn[aria-pressed="true"]{color:var(--shu);}
  .foot .bmjump{font:inherit;font-size:11px;letter-spacing:.14em;background:none;border:1px solid rgba(47,102,112,.55);color:var(--shu);padding:3px 10px;cursor:pointer;margin:0 8px;}
  .foot .bmjump[hidden]{display:none;}
  .sheet .bm-item{width:100%;text-align:left;font:inherit;font-size:13px;letter-spacing:.12em;background:none;border:1px solid rgba(47,102,112,.5);color:var(--shu);padding:10px 12px;margin:0 0 14px;cursor:pointer;}
  .sheet .bm-item[hidden]{display:none;}

  #homeLink{font:inherit;font-size:inherit;letter-spacing:.14em;color:var(--ink-soft);text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  #homeLink:hover,#homeLink:focus-visible{color:var(--ink);}
  #homeLink[hidden]{display:none;}
  .nextnav{margin:2.4em 0 0;text-align:center;text-indent:0;line-height:2;}
  .nextnav .lead{display:block;font-size:.8em;letter-spacing:.3em;color:var(--ink-soft);}
  .nextnav a{display:inline-block;margin-top:.4em;padding:.35em 1.1em;border:1px solid rgba(47,102,112,.55);color:var(--shu);
    text-decoration:none;letter-spacing:.12em;font-size:.95em;}
  .nextnav a + a{margin-left:.8em;}
  .page .opener.cov{overflow:hidden;}
  .page .opener.cov .covbg{position:absolute;left:-12px;right:-12px;height:52%;background-repeat:no-repeat;background-size:100% 4000%;filter:blur(6px);}
  .page .opener.cov .covbg.t{top:-12px;background-position:center top;}
  .page .opener.cov .covbg.b{bottom:-12px;background-position:center bottom;}
  .page .opener.cov img{position:relative;
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);
            mask-image:linear-gradient(180deg,transparent 0,#000 4%,#000 96%,transparent 100%);}
  .page .opener.cov.lr .covbg{top:-12px;bottom:-12px;height:auto;width:52%;background-size:4000% 100%;}
  .page .opener.cov.lr .covbg.t{left:-12px;right:auto;background-position:left center;}
  .page .opener.cov.lr .covbg.b{right:-12px;left:auto;bottom:-12px;background-position:right center;}
  .page .opener.cov.lr img{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%);}

  #covpick{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:6px;align-items:center;font-size:12px;color:#3E4A4C;background:rgba(241,243,239,.92);border:1px solid #C9D1CC;padding:6px 8px;border-radius:999px;font-family:sans-serif}
  #covpick button{font:inherit;border:1px solid #9AA6A8;background:#fff;color:#3E4A4C;width:26px;height:26px;border-radius:50%;cursor:pointer}
  #covpick button[aria-pressed="true"]{background:#2F6670;color:#fff;border-color:#2F6670}
  body.vert .page .up{text-orientation:upright;letter-spacing:0;}
  body.vert .page .sw{text-orientation:sideways;}
  .page .opener.lab{background:#F1F3EF;}
  .opener.lab .tag{background:#FBFBF8;border-top:1px solid #C9D1CC;border-bottom:1px solid #C9D1CC;width:100%;padding:28px 0 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 1px 0 #fff inset;}
  .opener.lab .n{font-size:13px;letter-spacing:.4em;color:var(--ink-soft);}
  .opener.lab .t{font-size:28px;letter-spacing:.3em;color:var(--ink);padding-left:.3em;}
  .page .opener.lab{flex-direction:column;justify-content:center;align-items:stretch;}
  .opener.lab .tag{align-self:stretch;}
  /* 縦書きの章扉：右上から縦に、記録番号は左下 */
  body.vert .opener.lab .tag{background:none;border:none;box-shadow:none;width:auto;padding:0;flex-direction:row-reverse;align-items:flex-start;gap:18px;align-self:flex-end;}
  body.vert .page .opener.lab{justify-content:flex-start;align-items:flex-end;padding:16% 14% 0 0;}
  body.vert .opener.lab .n,body.vert .opener.lab .t{writing-mode:vertical-rl;}
  body.vert .opener.lab .n{font-size:13px;letter-spacing:.5em;margin-top:6px;}
  body.vert .opener.lab .t{font-size:30px;letter-spacing:.45em;padding-left:0;}
  .opener.lab .no{top:auto !important;right:auto !important;left:20px;bottom:18px;}
  .opener.lab .no{position:absolute;top:18px;right:20px;font-family:"DotGothic16",monospace;font-size:11px;letter-spacing:.12em;color:#8A9599;}
  .opener.lab .lead{margin:30px auto 0;max-width:86%;text-wrap:balance;font-size:13.5px;line-height:2;letter-spacing:.06em;color:var(--ink-soft);text-align:center;}
  .page .opener.stub{flex-direction:column;gap:28px;background:#F1F3EF;}
  .stub .ticket{position:relative;width:min(70%,260px);background:#F7F6F1;border:1px solid #C9CEC9;padding:26px 18px 22px;text-align:center;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 14px -8px rgba(30,45,44,.35);}
  .stub .ticket .perf{position:absolute;left:-1px;right:-1px;top:-6px;height:12px;background:radial-gradient(circle at 6px 6px,#F1F3EF 3.6px,transparent 4px) repeat-x;background-size:12px 12px;}
  .stub .k{font-size:12px;letter-spacing:.4em;color:var(--ink-soft);}
  .stub .no{font-family:"DotGothic16",monospace;font-size:34px;letter-spacing:.1em;color:#47567E;}
  .stub .d{font-family:"DotGothic16",monospace;font-size:12px;color:#8A8574;letter-spacing:.1em;}
  .stub .back{font:inherit;font-size:13px;letter-spacing:.3em;background:none;border:1px solid rgba(47,102,112,.55);color:var(--shu);padding:8px 22px;cursor:pointer;position:relative;z-index:5;}
</style>

<body class="vert">
<div id="app">
  <div class="bar">
    <a id="homeLink" href="index.html" hidden>ほかの本</a>
    <button id="tocBtn" aria-haspopup="dialog">目次</button>
    <div class="ruler" aria-hidden="true">
      
      <svg id="rulerSvg" viewBox="0 0 300 26" preserveAspectRatio="none"></svg>
      
    </div>
    <button id="bmBtn" aria-pressed="false" aria-label="このページにしおりをはさむ">しおり</button>
    <button id="setBtn" aria-haspopup="dialog">表示</button>
  </div>

  <div id="book">
    <div class="spread">
      <section class="page" id="pageA" aria-live="polite"><div class="col"></div></section>
      <section class="page" id="pageB"><div class="col"></div></section>
    </div>
    <button class="zone l" id="zoneL" aria-label="前後のページ"></button>
    <button class="zone r" id="zoneR" aria-label="前後のページ"></button>
  </div>

  <div class="foot">
    <span id="chapNow"></span>
    <button class="bmjump" id="bmJump" type="button" hidden>しおりへ</button>
    <span id="pageNow"></span>
  </div>
</div>

<div class="sheet" id="tocSheet" role="dialog" aria-label="目次">
  <div class="sheet-in">
    <h3>目次</h3>
    <button class="bm-item" id="bmItem" type="button" hidden>しおりのページへ</button>
    <div id="tocList"></div>
    <button class="close" data-close>閉じる</button>
  </div>
</div>

<div class="sheet" id="setSheet" role="dialog" aria-label="表示設定">

    <h3>表示</h3>

      <span class="lab">組み方</span>

        <button data-dir="v" aria-pressed="true">縦書き</button>
        <button data-dir="h" aria-pressed="false">横書き</button>

    </div>
    <div class="row">
      <span class="lab">文字の大きさ</span>
      <div class="seg" id="sizeSeg">
        <button data-size="0" aria-pressed="false">小</button>
        <button data-size="1" aria-pressed="true">中</button>
        <button data-size="2" aria-pressed="false">大</button>
      </div>
    </div>
    <button class="close" data-close>閉じる</button>

<script>
const DATA = {"title": "919 エピソード1／失われた食卓", "sub": "失われた食卓", "blocks": [{"t": "opener", "i": 0, "alt": "序章　配給", "lead": "朝の七時、共同の食堂には、もう長い列ができていた。"}, {"t": "p", "h": "朝の七時、共同の食堂には、もう長い列ができていた。"}, {"t": "p", "h": "列のなかほどに、背の低い男が立っていた。丸い顔に、黒い髪を短く刈っている。眉の上で切った前髪が、少しだけ不ぞろいだった。"}, {"t": "p", "h": "よしゆきは、あくびをかみ殺して、入り口の機械に配給券をかざした。白い光が一度だけまたたいて、トレイが一枚せり出してくる。茶碗に半分のご飯と、薄い汁と、煮豆がひとさじ。先月より、ご飯が少し減っていた。券の端には、四桁の番号が小さく印字されている。毎朝、ちがう番号だった。"}, {"t": "p", "h": "よしゆきは、窓ぎわの長いテーブルのいつもの席に座った。"}, {"t": "p", "h": "しばらくして、入り口から男が一人、トレイを持って歩いてきた。黒い髪のてっぺんが、寝ぐせのまま立っている。厚い唇が半分開いていて、顎には無精ひげが残っていた。"}, {"t": "p", "h": "かずまだった。"}, {"t": "p", "h": "よしゆきは、顔を上げて言った。"}, {"t": "p", "h": "「おせーよ」"}, {"t": "p", "h": "「お前が早すぎんだよ」"}, {"t": "p", "h": "かずまは隣に座った。よしゆきはもう、ご飯を半分食べていた。"}, {"t": "p", "h": "「寮のころより、ましだな」"}, {"t": "p", "h": "かずまが茶碗を持ちあげて言った。"}, {"t": "p", "h": "「寮のころのほうが、多かっただろ」"}, {"t": "p", "h": "「味がちがうんだよ、味が」"}, {"t": "p", "h": "「同じ米だろ」"}, {"t": "p", "h": "かずまは返事をせずに、自分の茶碗をのぞきこんだ。それから人差し指を頬に当てて、天井を見た。"}, {"t": "p", "h": "「なあ、豆とご飯、どっちが腹にたまると思う」"}, {"t": "p", "h": "「知らねーよ」"}, {"t": "p", "h": "「俺はご飯に賭ける」"}, {"t": "p", "h": "「何も賭けてねーだろ」"}, {"t": "p", "h": "「は？　賭けてるわ。外れたら、俺の煮豆やるよ」"}, {"t": "p", "h": "かずまはご飯をひと口すくうと、よしゆきの口に押しこんだ。"}, {"t": "p", "h": "「ほら、検証」"}, {"t": "p", "h": "よしゆきはむせながら、それを飲みこんだ。"}, {"t": "p", "h": "「またかよ」"}, {"t": "p", "h": "「どうよ。たまったか」"}, {"t": "p", "h": "「たまるか、ひと口で」"}, {"t": "p", "h": "かずまが声をあげて笑った。よしゆきもつられて、歯を見せて、目がなくなるほど笑った。肩がゆれて、手に持っていた汁が少しこぼれた。"}, {"t": "p", "h": "「きったねえ」"}, {"t": "p", "h": "「お前のせいだろ」"}, {"t": "p", "h": "かずまは自分の袖で、テーブルの汁をふいた。袖が茶色くなった。"}, {"t": "p", "h": "食堂の奥では、灰色の作業着の人たちが、空になったトレイを黙って重ねていた。誰の手も、同じ速さで動いていた。配膳係だった。その前には、茶碗がひとつもなかった。あの人たちが座って食べているところを、よしゆきは一度も見たことがなかった。"}, {"t": "p", "h": "よしゆきは汁をすすりながら、その背中をぼんやり見ていた。"}, {"t": "p", "h": "かずまは見ていなかった。"}, {"t": "p", "h": "よしゆきの箸は、いつのまにか止まっていた。"}, {"t": "p", "h": "「早く食えよ。遅れるぞ」"}, {"t": "p", "h": "かずまが立ちあがった。よしゆきは残りのご飯をかきこんで、トレイを返しに行った。"}, {"t": "p", "h": "返却口の向こうで、灰色の作業着の手が、黙ってそれを受けとった。顔は見えなかった。手は乾いていて、指の先まで白かった。"}, {"t": "p", "h": "食堂を出ても、口の中には、さっき押しこまれたご飯の味が残っていた。"}, {"t": "opener", "i": 1, "alt": "第一章　無味無臭", "lead": "その日の帰り道、よしゆきは食堂の裏の細い道を歩いていた。"}, {"t": "p", "h": "その日の帰り道、よしゆきは食堂の裏の細い道を歩いていた。"}, {"t": "p", "h": "日は落ちかけていて、通りの明かりがひとつずつ灯りはじめている。食堂の夕飯の列には、まだ少し早かった。"}, {"t": "p", "h": "道の先の、閉まったシャッターの前に、男が一人しゃがんでいた。"}, {"t": "p", "h": "前髪が目にかかるほど伸びていて、寝起きのようにぼさぼさだった。くたびれた上着には、乾いた白いしみが点々とついている。男はよしゆきに気づくと、しゃがんだまま、じっと見上げてきた。"}, {"t": "p", "h": "よしゆきは目をそらして、横を通りすぎようとした。"}, {"t": "p", "h": "「お兄さん」"}, {"t": "p", "h": "男が立ちあがった。"}, {"t": "p", "h": "「お腹、すいてませんか」"}, {"t": "p", "h": "「すいてねーよ」"}, {"t": "p", "h": "「配給、先月からまた減りましたよね。みなさん、すいてるはずなんですけど」"}, {"t": "p", "h": "「だから、すいてねーって」"}, {"t": "p", "h": "「そうですか。じゃあ、これ」"}, {"t": "p", "h": "男は上着のポケットから、細い瓶を一本取りだした。透明な瓶に、透明な中身。白いラベルに、小さく「<span class=\"up\">919</span>」とだけ印字されている。"}, {"t": "p", "h": "「なんだよ、それ」"}, {"t": "p", "h": "「飲みものです。ただで差しあげます」"}, {"t": "p", "h": "「いらねー」"}, {"t": "p", "h": "「ヤマといいます。怪しいものじゃないですよ」"}, {"t": "p", "h": "「名乗ったら怪しくなくなるわけじゃねーだろ」"}, {"t": "p", "h": "ヤマは瓶を差しだしたまま、首をかしげた。"}, {"t": "p", "h": "「飲めないんですか」"}, {"t": "p", "h": "「飲めないんじゃなくて、飲まねーの」"}, {"t": "p", "h": "「同じことですよ。……怖いんですね」"}, {"t": "p", "h": "「怖くねーよ」"}, {"t": "p", "h": "「無理しなくていいですよ。お兄さんみたいな人は、だいたいそこで帰りますから」"}, {"t": "p", "h": "よしゆきは瓶をひったくった。キャップをひねって、一息に飲みほした。"}, {"t": "p", "h": "冷たかった。それだけだった。水の味さえしなかった。"}, {"t": "p", "h": "「ほら、飲んだぞ。満足かよ」"}, {"t": "p", "h": "空の瓶を突きかえすと、ヤマはそれを両手で受けとった。それから、片方の口角だけを上げた。"}, {"t": "p", "h": "「<strong>どんな気持ち？</strong>」"}, {"t": "p", "h": "「何がだよ」"}, {"t": "p", "h": "「いえ。覚えておいてください、今の気持ち」"}, {"t": "p", "h": "ヤマは小さく頭を下げると、来た道とは反対のほうへ歩いていった。その背中が、通りの明かりの外に消えた。"}, {"t": "p", "h": "よしゆきは、手の甲で口をぬぐった。口の中には、何も残っていなかった。瓶を握っていた手のひらだけが、まだ冷たかった。"}, {"t": "p", "h": "食堂の前を通ると、夕飯の列ができていた。湯気のにおいが、通りまで流れてきている。列の真ん中から、寝ぐせの立った頭が一つ突きでている。かずまだった。こちらに気づいて、片手を大きく振っている。"}, {"t": "p", "h": "「おい、並ばねえの」"}, {"t": "p", "h": "かずまの声が、列の上を飛んできた。"}, {"t": "p", "h": "「いい。腹いっぱい」"}, {"t": "p", "h": "「何食ったんだよ」"}, {"t": "p", "h": "「水」"}, {"t": "p", "h": "「うそつけ」"}, {"t": "p", "h": "よしゆきは、かずまに手を振りかえして、そのまま列の前を通りすぎた。"}, {"t": "p", "h": "その夜、よしゆきは夕飯を食べなかった。"}, {"t": "opener", "i": 2, "alt": "第二章　拒絶反応", "lead": "翌朝も、食堂には長い列ができていた。"}, {"t": "p", "h": "翌朝も、食堂には長い列ができていた。"}, {"t": "p", "h": "よしゆきは券をかざして、トレイを受けとった。茶碗に半分のご飯と、薄い汁と、煮豆がひとさじ。昨日と同じだった。"}, {"t": "p", "h": "よしゆきが窓ぎわの席に座ってしばらくすると、かずまが、寝ぐせの頭をかきながらトレイを持ってきた。"}, {"t": "p", "h": "「おせーよ」"}, {"t": "p", "h": "「お前が早すぎんだよ」"}, {"t": "p", "h": "「昨日、なんで並ばなかったんだよ」"}, {"t": "p", "h": "「腹いっぱいだったって言っただろ」"}, {"t": "p", "h": "「水でな」"}, {"t": "p", "h": "かずまは笑って、よしゆきのトレイに手を伸ばした。煮豆を指でつまみ、口に放りこむ。"}, {"t": "p", "h": "「おい」"}, {"t": "p", "h": "「利子」"}, {"t": "p", "h": "「なんのだよ」"}, {"t": "p", "h": "よしゆきはかずまの茶碗から、ご飯をひと箸さらった。かずまが取りかえそうと箸を伸ばし、二人の箸が茶碗の上でぶつかった。寮のころから、ずっとこうだった。"}, {"t": "p", "h": "よしゆきは、さらったご飯を口に入れた。"}, {"t": "p", "h": "噛んだとたん、喉の奥が勝手に閉じた。"}, {"t": "p", "h": "口の中のものが、押しもどされてくる。よしゆきはトレイの上に顔をふせて、そのまま吐きだした。ご飯粒が、汁の椀のふちに散った。"}, {"t": "p", "h": "周りの何人かが、ちらりとこちらを見て、すぐに自分の茶碗に目をもどした。"}, {"t": "p", "h": "「うわ、きったねえ」"}, {"t": "p", "h": "かずまが椅子ごと身を引いた。"}, {"t": "p", "h": "「飲みすぎだろ、お前」"}, {"t": "p", "h": "「飲んでねーよ」"}, {"t": "p", "h": "「水をか」"}, {"t": "p", "h": "「うるせー」"}, {"t": "p", "h": "よしゆきは、手の甲で口をぬぐった。喉はもう落ちついていた。気持ち悪さも、どこにもない。ただ、<strong>ご飯だけが</strong>、喉を通らなかった。"}, {"t": "p", "h": "自分の茶碗のご飯を、もう一度だけ口に入れてみた。同じだった。"}, {"t": "p", "h": "かずまは笑うのをやめて、よしゆきの顔をのぞきこんだ。"}, {"t": "p", "h": "「医者、行けよ」"}, {"t": "p", "h": "「行かねーよ。なんともねーし」"}, {"t": "p", "h": "「なんともねえやつは、飯吐かねえんだよ」"}, {"t": "p", "h": "「吐いたけど、なんともねーんだよ」"}, {"t": "p", "h": "かずまは少しのあいだ黙っていた。それから自分の茶碗を持ちあげて、残りのご飯を一気にかきこんだ。"}, {"t": "p", "h": "「遅れる。昼まで生きてろよ」"}, {"t": "p", "h": "かずまは立ちあがって、配達の鞄を肩にかけた。出口でもう一度振りかえり、片手を上げて、出ていった。"}, {"t": "p", "h": "よしゆきは、ほとんど手をつけていないトレイを、返却口に持っていった。灰色の作業着の手が、黙ってそれを受けとった。吐いたあとのトレイを見ても、その手は少しも止まらなかった。"}, {"t": "p", "h": "その日の最初の仕事は、この食堂の入り口の機械だった。券を読みそこねることがある、と朝から言われていた。よしゆきは工具の鞄を開けて、機械の前の板をはずした。"}, {"t": "p", "h": "機械のすぐ横の返却口で、灰色の作業着の手が、トレイを一枚ずつ重ねていった。いつもと同じ速さだった。よしゆきの手も、いつもと同じ速さで、ねじをゆるめていた。"}, {"t": "p", "h": "腹は、朝から一度も鳴っていなかった。"}, {"t": "opener", "i": 3, "alt": "第三章　無傷", "lead": "三日たっても、よしゆきの体は戻らなかった。"}, {"t": "p", "h": "三日たっても、よしゆきの体は戻らなかった。"}, {"t": "p", "h": "朝の食堂で、よしゆきは煮豆をひと粒だけ口に入れた。噛む前に、喉が閉じた。汁をすすると、それも押しもどされてきた。きのうまでは、汁なら通っていた。吐きだしたあとも、舌の上には汁の味が残っていた。塩が、少し足りなかった。味は、ちゃんと分かった。"}, {"t": "p", "h": "よしゆきは箸の先で、茶碗のご飯を少しずつ寄せた。山の形を変えては、また崩す。遠くから見れば、食べているように見えるはずだった。"}, {"t": "p", "h": "「なあ」"}, {"t": "p", "h": "隣で、かずまが茶碗から顔を上げた。"}, {"t": "p", "h": "「今日の配達、何軒入ってると思う」"}, {"t": "p", "h": "「知らねーよ」"}, {"t": "p", "h": "「当てたら、お前の煮豆もらう」"}, {"t": "p", "h": "「外れたら」"}, {"t": "p", "h": "「お前に俺の煮豆やる」"}, {"t": "p", "h": "「どっちにしても、豆が動くだけじゃねーか」"}, {"t": "p", "h": "かずまは人差し指を頬に当てて、天井を見た。"}, {"t": "p", "h": "「四十二」"}, {"t": "p", "h": "「多すぎだろ」"}, {"t": "p", "h": "「は？　きのうは三十九だったんだよ。伸びしろだよ、伸びしろ」"}, {"t": "p", "h": "よしゆきは笑った。笑いながら、茶碗のご飯を、また少し寄せた。"}, {"t": "p", "h": "かずまが立ちあがって、よしゆきの茶碗をのぞきこんだ。"}, {"t": "p", "h": "「お前、それ残すの」"}, {"t": "p", "h": "「腹いっぱいなんだよ」"}, {"t": "p", "h": "「じゃあ、もらう」"}, {"t": "p", "h": "かずまは返事を待たずに、よしゆきの茶碗を自分のトレイに移した。そのまま、立ったままかきこむ。寮のころなら、取りかえそうと箸を伸ばすところだった。よしゆきの手は、膝の上から動かなかった。茶碗の底が見えるまで、かずまは一度も顔を上げなかった。"}, {"t": "p", "h": "「ごちそうさん。四十二軒、行ってくるわ」"}, {"t": "p", "h": "かずまは配達の鞄を肩にかけて、出ていった。よしゆきも、工具の鞄を持って立ちあがった。"}, {"t": "p", "h": "昼すぎ、配給所の機械を直していて、ねじまわしが滑った。とがった先が、左手の人差し指に入った。"}, {"t": "p", "h": "血が、ひと筋にじんだ。"}, {"t": "p", "h": "よしゆきは指を布でぬぐった。もう一度見ると、血は止まっていた。指の腹をこすってみても、切れた跡がどこにもなかった。"}, {"t": "p", "h": "夕方、配給所の裏に、機械の部品の箱が届いた。いつもなら二人がかりで一つ運ぶ重さだった。よしゆきは一人で二つ担いで、倉庫まで運んだ。息は、少しも切れなかった。"}, {"t": "p", "h": "三日、ほとんど何も食べていない。それなのに、体は軽かった。"}, {"t": "p", "h": "機械の銀色の扉に、自分の顔が映っていた。頬に、三日前より赤みがさしていた。"}, {"t": "p", "h": "帰りじたくをしながら、よしゆきは左手の人差し指を、何度も親指でこすった。"}, {"t": "p", "h": "<strong>線一本</strong>、残っていなかった。"}, {"t": "opener", "i": 4, "alt": "第四章　一日一本", "lead": "五日目の夕方、食堂の入り口の機械を直していて、よしゆきの手から工具が滑り落ちた。"}, {"t": "p", "h": "五日目の夕方、食堂の入り口の機械を直していて、よしゆきの手から工具が滑り落ちた。"}, {"t": "p", "h": "拾おうとして、しゃがんだまま立てなくなった。足に力が入らない。指先が、自分のものではないように冷たかった。きのうまで部品の箱を二つ担いでいた腕が、ねじまわし一本を持ちあげられなかった。"}, {"t": "p", "h": "配膳係が、黙って工具を拾って、鞄にもどした。何も言わずに、奥へ戻っていった。"}, {"t": "p", "h": "よしゆきは壁に手をついて、裏口から外に出た。"}, {"t": "p", "h": "細い道に、夕方の明かりが灯りはじめていた。閉まったシャッターの前に、見おぼえのある背中がしゃがんでいた。"}, {"t": "p", "h": "「お疲れさまです」"}, {"t": "p", "h": "ヤマが立ちあがった。前髪のあいだから、黒目がちの目でよしゆきを見上げる。"}, {"t": "p", "h": "「そろそろだと思ってました。<span class=\"up\">919</span>さん」"}, {"t": "p", "h": "「……誰が<span class=\"up\">919</span>だよ」"}, {"t": "p", "h": "「あなたですよ」"}, {"t": "p", "h": "ヤマは上着のポケットから、細い瓶を取りだした。透明な瓶に、透明な中身。白いラベルの番号の前に、「Sui」の三文字が足されていた。"}, {"t": "p", "h": "「なんだよ、それ」"}, {"t": "p", "h": "「あなたのおかげで、やっと名前がつきました」"}, {"t": "p", "h": "「意味わかんねー」"}, {"t": "p", "h": "「飲めば分かりますよ。今のあなたの体は、これでしか動かないので」"}, {"t": "p", "h": "よしゆきは瓶を見た。それから、ヤマの顔を見た。"}, {"t": "p", "h": "「飲まなかったら」"}, {"t": "p", "h": "「飲まなかったら、ですか」"}, {"t": "p", "h": "ヤマは少し考えるふりをした。"}, {"t": "p", "h": "「ご飯は、もう通らないでしょう。汁も、豆も。これから先、何も通らなくなります。それで、どうやって生きるつもりです」"}, {"t": "p", "h": "よしゆきは何も言えなかった。足が、また少しふらついた。"}, {"t": "p", "h": "「……なんで、俺なんだよ」"}, {"t": "p", "h": "「なんででしょうね」"}, {"t": "p", "h": "ヤマが瓶を差しだした。今度は、ひったくらなかった。受けとって、キャップをひねって、一息に飲んだ。"}, {"t": "p", "h": "冷たかった。やっぱり、何の味もしなかった。"}, {"t": "p", "h": "飲みおえたとたん、指先に血がめぐってくるのが分かった。足の裏が、地面をつかんだ。四日ぶりに、体の奥があたたかくなった。"}, {"t": "p", "h": "ヤマが、片方の口角だけを上げた。"}, {"t": "p", "h": "「どんな気持ち？」"}, {"t": "p", "h": "「……知らねーよ」"}, {"t": "p", "h": "「いいですね。覚えておいてください」"}, {"t": "p", "h": "ヤマは紙袋を、よしゆきの腕に押しつけた。中で、瓶がいくつも触れあって、小さな音を立てた。"}, {"t": "p", "h": "「七本あります。一日一本。なくなるころに、また、うちから届けます」"}, {"t": "p", "h": "「うちって、どこだよ」"}, {"t": "p", "h": "ヤマは答えずに、小さく頭を下げた。その背中が、通りの明かりの外に消えた。"}, {"t": "p", "h": "よしゆきは紙袋をのぞいた。七本の瓶に、同じラベルが貼ってあった。"}, {"t": "p", "h": "食堂の窓から、夕飯の湯気が細い道まで流れてきていた。よしゆきは紙袋を抱えなおして、そのにおいに背を向けた。"}, {"t": "opener", "i": 5, "alt": "第五章　欠食", "lead": "その朝から、よしゆきは配給券をかざさなくなった。"}, {"t": "p", "h": "その朝から、よしゆきは配給券をかざさなくなった。"}, {"t": "p", "h": "列には並ばずに、まっすぐ窓ぎわのテーブルへ行った。部屋を出る前に、瓶を一本飲んできた。腹の底は、それで静かだった。ポケットの中で、使わなかった券の端が指に当たった。"}, {"t": "p", "h": "よしゆきは、いつもの席に座った。しばらくして、かずまがトレイを持ってきた。"}, {"t": "p", "h": "「おせーよ」"}, {"t": "p", "h": "「お前が早すぎんだよ」"}, {"t": "p", "h": "かずまは隣に座った。そのトレイには、いつもの茶碗と汁と煮豆がある。よしゆきの前には、何もなかった。"}, {"t": "p", "h": "かずまは汁をすすって、それから、よしゆきの前のテーブルを見た。"}, {"t": "p", "h": "「お前、トレイは」"}, {"t": "p", "h": "「いらねー」"}, {"t": "p", "h": "「は？　配給、いらねえやつがいるかよ」"}, {"t": "p", "h": "「腹、減ってねーんだよ」"}, {"t": "p", "h": "「ダイエットか」"}, {"t": "p", "h": "「ちげーよ」"}, {"t": "p", "h": "かずまは、よしゆきの顔をのぞきこんだ。"}, {"t": "p", "h": "「なんも食ってねえやつの顔じゃねえな。むしろ、つやつやしてんじゃん」"}, {"t": "p", "h": "「うるせー」"}, {"t": "p", "h": "かずまは笑った。よしゆきの口の端が、少しだけ動いた。"}, {"t": "p", "h": "「じゃあ、お前の分の券、俺にくれよ。二人前食える」"}, {"t": "p", "h": "「やらねーよ」"}, {"t": "p", "h": "「ケチ」"}, {"t": "p", "h": "いつもなら、ここでよしゆきが言い返して、かずまがむきになる。よしゆきは何も言わなかった。窓の外を、配達の小さな車が一台、通りすぎていった。"}, {"t": "p", "h": "かずまは煮豆を指でつまんだ。それから、いつものように、よしゆきのトレイのほうへ手を伸ばした。"}, {"t": "p", "h": "指の先が、<strong>何もないテーブル</strong>に触れた。"}, {"t": "p", "h": "かずまの手が、そこで一度止まった。それから、何もなかったように引っこんで、自分の煮豆を口に放りこんだ。"}, {"t": "p", "h": "「利子、取りそびれたわ」"}, {"t": "p", "h": "「なんの利子だよ」"}, {"t": "p", "h": "「知らねえ」"}, {"t": "p", "h": "かずまはまた笑った。今度は、よしゆきの口の端も動かなかった。"}, {"t": "p", "h": "かずまは人差し指を頬に当てて、天井を見た。"}, {"t": "p", "h": "「なあ、今日の配達、何軒入ってると思う」"}, {"t": "p", "h": "「知らねーよ」"}, {"t": "p", "h": "「当てたら、なんかやるよ」"}, {"t": "p", "h": "「なんかって何だよ」"}, {"t": "p", "h": "「なんか」"}, {"t": "p", "h": "よしゆきは答えなかった。かずまは指を頬から下ろして、茶碗のご飯をかきこんだ。"}, {"t": "p", "h": "「行くわ」"}, {"t": "p", "h": "かずまは配達の鞄を肩にかけて、立ちあがった。出口でいつものように振りかえりかけて、そのまま出ていった。"}, {"t": "p", "h": "かずまの茶碗には、ご飯が少し残っていた。寮のころなら、残りをどちらが取るかで箸がぶつかった。"}, {"t": "p", "h": "食堂の奥で、灰色の作業着の配膳係が、空になったトレイを黙って重ねていた。その前にも、茶碗はなかった。"}, {"t": "p", "h": "よしゆきは工具の鞄を持って、立ちあがった。"}, {"t": "p", "h": "返却口の前を、素通りした。返すトレイは、なかった。"}, {"t": "opener", "i": 6, "alt": "第六章　再検証", "lead": "六日たっても、よしゆきの前には何も置かれなかった。"}, {"t": "p", "h": "六日たっても、よしゆきの前には何も置かれなかった。"}, {"t": "p", "h": "その朝も、よしゆきは列に並ばずに、窓ぎわの席へ行った。ヤマにもらった瓶は、残り一本になっていた。上着のポケットの中で、歩くたびに小さく鳴った。"}, {"t": "p", "h": "しばらくして、かずまがトレイを持ってきた。"}, {"t": "p", "h": "「おせーよ」"}, {"t": "p", "h": "「お前が早すぎんだよ」"}, {"t": "p", "h": "いつもの言い合いだった。かずまは隣に座ったが、茶碗には手をつけなかった。"}, {"t": "p", "h": "「なあ」"}, {"t": "p", "h": "「なんだよ」"}, {"t": "p", "h": "「……なんでもねえ」"}, {"t": "p", "h": "かずまは人差し指を頬に当てて、天井を見た。何も賭けないまま、指を下ろした。それから、茶碗を持ちあげた。"}, {"t": "p", "h": "かずまは箸で、ご飯をひと口すくった。それを、よしゆきの口元に差しだした。"}, {"t": "p", "h": "「ほら、検証」"}, {"t": "p", "h": "寮の食堂でも、この食堂でも、何度も同じことをしてきた。押しこまれるのは、いつもよしゆきのほうだった。"}, {"t": "p", "h": "今日のかずまは、押しこまなかった。箸の先を、よしゆきの口の少し手前で止めて、待っていた。箸を持つ手は、少しも揺れていなかった。"}, {"t": "p", "h": "よしゆきは、かずまの顔を見た。かずまは笑っていなかった。目の下が、少し黒ずんでいた。"}, {"t": "p", "h": "「……たまるか、ひと口で」"}, {"t": "p", "h": "よしゆきはそう言って、口を開けた。"}, {"t": "p", "h": "ご飯が、舌の上にのった。噛む前に、喉が閉じた。"}, {"t": "p", "h": "よしゆきは顔をそむけて、テーブルの下に吐きだした。ご飯粒が、床に散った。"}, {"t": "p", "h": "よしゆきは手の甲で口をぬぐった。わりい、と言おうとして、声が出なかった。"}, {"t": "p", "h": "<strong>かずまの手が、止まった。</strong>"}, {"t": "p", "h": "箸の先には、まだ二、三粒、ご飯が残っていた。かずまはその箸を、差しだしたときの高さのまま、しばらく下ろさなかった。"}, {"t": "p", "h": "きったねえ、とは言わなかった。"}, {"t": "p", "h": "食堂の音が、遠くに聞こえた。トレイを重ねる音。入り口の機械が、券を読む音。"}, {"t": "p", "h": "かずまは、ゆっくり箸を下ろして、茶碗のふちに置いた。それから、自分の袖で、テーブルのふちに飛んだご飯粒をふいた。袖に、白い粒がいくつもついた。"}, {"t": "p", "h": "立ちあがりかけたかずまの目が、よしゆきの上着のポケットに行った。吐いたひょうしに、透明な瓶の口がのぞいていた。白いラベルに、「<span class=\"sw\">Sui919</span>」の文字が見えていた。よしゆきは、瓶をポケットの奥に押しこんだ。"}, {"t": "p", "h": "「……行くわ」"}, {"t": "p", "h": "かずまは茶碗のご飯を残したまま、立ちあがった。配達の鞄を肩にかけて、出口へ歩いていく。一度も振りかえらなかった。"}, {"t": "p", "h": "床のご飯粒を、灰色の作業着の配膳係が、黙って拾っていった。その手は乾いていて、指の先まで白かった。拾いおわると、何も言わずに奥へ戻った。"}, {"t": "p", "h": "よしゆきは、ポケットに手を入れて、最後の一本の瓶を握った。"}, {"t": "p", "h": "口の中には、何も残っていなかった。"}, {"t": "opener", "i": 7, "alt": "第七章　識別番号", "lead": "次の朝、かずまは来なかった。"}, {"t": "p", "h": "次の朝、かずまは来なかった。いつもの時間を過ぎても、入り口から寝ぐせの頭は入ってこなかった。"}, {"t": "p", "h": "ポケットの瓶は、今朝、部屋を出る前に飲んだので、もうなかった。ヤマにもらった七本は、今朝の一本で終わりだった。"}, {"t": "p", "h": "灰色の作業着の配膳係が一人、トレイを重ねる手を止めて、こちらへ歩いてきた。よしゆきの前のテーブルに、紙袋を一つ置いた。中で、瓶が触れあう音がした。"}, {"t": "p", "h": "配膳係は何も言わずに、背を向けた。"}, {"t": "p", "h": "「おい」"}, {"t": "p", "h": "よしゆきは立ちあがって、その腕をつかんだ。灰色の袖の下の腕は、乾いていて、冷たかった。"}, {"t": "p", "h": "配膳係が振りかえった。顔を、初めて正面から見た。よしゆきと同じくらいの年の男だった。頬につやがあって、血色がよかった。目は開いているのに、よしゆきのどこも見ていなかった。"}, {"t": "p", "h": "作業着の胸のポケットから、細い瓶の口がのぞいていた。透明な瓶に、白いラベル。"}, {"t": "p", "h": "よしゆきは、その瓶を引きぬいた。"}, {"t": "p", "h": "ラベルには、小さく「<span class=\"up\">525</span>」とだけ印字されていた。番号の前に、何の文字もなかった。"}, {"t": "p", "h": "「……お前も、飲んだのか」"}, {"t": "p", "h": "配膳係は答えなかった。腕をつかまれたまま、ただ立っていた。痛がりもしなかった。"}, {"t": "p", "h": "よしゆきは手をはなした。配膳係は瓶を受けとりもせずに、元の場所へ戻って、またトレイを重ねはじめた。さっきと同じ速さだった。"}, {"t": "p", "h": "よしゆきは、手の中の瓶を見た。それから、食堂の奥を見た。"}, {"t": "p", "h": "灰色の作業着が、六人いた。誰の前にも、茶碗はなかった。誰も、座って食べていなかった。どの頬も、つやがあって、血色がよかった。胸のポケットには、みな同じ形の瓶が入っていた。"}, {"t": "p", "h": "よしゆきは奥へ歩いていって、一人ずつ、瓶のラベルをのぞいた。"}, {"t": "p", "h": "<span class=\"up\">87</span>。<span class=\"up\">233</span>。<span class=\"up\">504</span>。<span class=\"up\">651</span>。<span class=\"up\">790</span>。"}, {"t": "p", "h": "番号の前には、どれも<strong>何の文字もなかった</strong>。"}, {"t": "p", "h": "誰も、よしゆきを止めなかった。のぞきこまれても、手の速さは変わらなかった。"}, {"t": "p", "h": "よしゆきは、自分の紙袋を開けた。七本の瓶に、同じラベルが貼ってあった。番号の前に、三つの文字。"}, {"t": "p", "h": "<span class=\"sw\">Sui919</span>。"}, {"t": "p", "h": "ヤマの声が、耳の奥で聞こえた。あなたのおかげで、やっと名前がつきました。"}, {"t": "p", "h": "返却口の向こうで、トレイが一枚ずつ重なっていく音がした。よしゆきは、<span class=\"up\">525</span>の瓶を、テーブルの上にそっと置いた。"}, {"t": "p", "h": "よしゆきは、自分の頬にさわった。つるりとして、あたたかかった。"}, {"t": "p", "h": "窓のガラスに、食堂の中が映っていた。灰色の背中の列のそばに、よしゆきが立っていた。前には、何もなかった。"}, {"t": "p", "h": "ガラスに映った自分の顔色は、配膳係たちと見分けがつかなかった。"}, {"t": "opener", "i": 8, "alt": "第八章　先輩", "lead": "その日の夕方、よしゆきは食堂の裏の細い道で、ヤマを待った。"}, {"t": "p", "h": "その日の夕方、よしゆきは食堂の裏の細い道で、ヤマを待った。"}, {"t": "p", "h": "閉まったシャッターの前に立って、通りの明かりが灯るのを見ていた。今朝、配膳係から受けとった紙袋を、足もとに置いた。中の七本は、まだ手つかずだった。"}, {"t": "p", "h": "足音はしなかった。気づいたときには、ヤマが隣にしゃがんでいた。"}, {"t": "p", "h": "「お待たせしました、<span class=\"up\">919</span>さん」"}, {"t": "p", "h": "「待ってねーよ」"}, {"t": "p", "h": "「待ってましたよ。顔に書いてあります」"}, {"t": "p", "h": "「<span class=\"up\">525</span>」"}, {"t": "p", "h": "よしゆきは、朝に見たラベルの番号を口にした。"}, {"t": "p", "h": "「<span class=\"up\">87</span>。<span class=\"up\">233</span>。<span class=\"up\">504</span>。……あいつら、なんなんだよ」"}, {"t": "p", "h": "ヤマは、少しだけ目を細めた。"}, {"t": "p", "h": "「先輩ですよ。<span class=\"up\">919</span>さんの」"}, {"t": "p", "h": "「先輩」"}, {"t": "p", "h": "「みなさん、<span class=\"up\">919</span>さんより先に飲んでくれた人たちです。一人目から、九百十八人目まで」"}, {"t": "p", "h": "ヤマは指を一本ずつ折るまねをして、途中でやめた。"}, {"t": "p", "h": "「うまくいかなかったんです。体が作りかわりすぎて。食べなくても動くようになったけど、そのぶん、いろいろ抜けちゃって」"}, {"t": "p", "h": "「いろいろって、なんだよ」"}, {"t": "p", "h": "「うれしいとか、さびしいとか。昔のこととか」"}, {"t": "p", "h": "よしゆきは、紙袋の持ち手を握った。灰色の袖の下の、乾いた冷たい腕を思い出した。目は開いているのに、どこも見ていなかった顔も。"}, {"t": "p", "h": "「九百十九人目で、やっとうまくいきました。だから、名前をつけたんです。<span class=\"sw\">Sui919</span>」"}, {"t": "p", "h": "「俺の番号かよ」"}, {"t": "p", "h": "「<span class=\"up\">919</span>さんの番号ですよ」"}, {"t": "p", "h": "ヤマは、よしゆきの足もとの紙袋をのぞいた。"}, {"t": "p", "h": "「七本、そろってますね。前の最後の一本は、今朝、飲みきったんでしょう。えらいです」"}, {"t": "p", "h": "ヤマの声は、子どもをほめるときのようにやわらかかった。"}, {"t": "p", "h": "「……俺も、ああなるのか」"}, {"t": "p", "h": "声が、自分で思ったより小さかった。"}, {"t": "p", "h": "ヤマは首をかしげた。"}, {"t": "p", "h": "「さあ。今のところ、<span class=\"up\">919</span>さんは、うまくいってます。気持ちも、ちゃんと残ってるでしょう。怒ってますし」"}, {"t": "p", "h": "「怒ってねーよ」"}, {"t": "p", "h": "「怒ってますよ」"}, {"t": "p", "h": "ヤマは立ちあがって、膝の汚れを払った。払っても、白いしみは落ちなかった。"}, {"t": "p", "h": "ヤマは、通りの向こうの食堂の明かりを見た。夕飯の列が、角を曲がるほど長くのびていた。列の中に、寝ぐせの立った頭は見えなかった。"}, {"t": "p", "h": "「九百十八人で、<strong>何億人</strong>が飢えずにすむんですよ」"}, {"t": "p", "h": "それから、よしゆきのほうを向いて、片方の口角だけを上げた。"}, {"t": "p", "h": "「……どんな気持ち？」"}, {"t": "p", "h": "よしゆきは答えなかった。答えられる言葉が、どこにもなかった。"}, {"t": "p", "h": "ヤマは小さく頭を下げた。いつものように、来た道と反対のほうへ歩いていった。"}, {"t": "p", "h": "よしゆきは紙袋から一本取りだした。ラベルの番号を、親指で隠した。"}, {"t": "p", "h": "それから、瓶を紙袋に戻した。"}, {"t": "opener", "i": 9, "alt": "第九章　味覚欠落", "lead": "それから三日、よしゆきは朝の食堂に一度も行かなかった。"}, {"t": "p", "h": "それから三日、よしゆきは朝の食堂に一度も行かなかった。"}, {"t": "p", "h": "昼すぎ、食堂の入り口の機械を直しに行った。券を読む光が、ときどき弱くなる。板をはずして、中の部品を一つずつ確かめていった。昼の列の人たちが、券をかざしては首をかしげていた。"}, {"t": "p", "h": "食堂の奥から、炊きあがったご飯のにおいが流れてきた。"}, {"t": "p", "h": "よしゆきは、ねじまわしを持つ手を止めた。"}, {"t": "p", "h": "ご飯のにおいだ、ということは分かった。それが、どんな味だったのかが、出てこなかった。"}, {"t": "p", "h": "あの朝のことは、はっきり覚えている。かずまの「ほら、検証」という声。口に押しこまれた箸の先。むせて、汁をこぼして、かずまが袖でふいたこと。二人で笑ったこと。別の朝、かずまが煮豆をつまんで「利子」と言ったことも、覚えている。"}, {"t": "p", "h": "その口の中に何があったのかだけが、白く抜けていた。"}, {"t": "p", "h": "甘かったのか。しょっぱかったのか。あたたかかったのか。思い出そうとするほど、そこだけが遠くなった。"}, {"t": "p", "h": "返却口から、配膳係がトレイを運んでいった。一枚の茶碗のふちに、ご飯粒が一つ残っていた。"}, {"t": "p", "h": "よしゆきは、それを指でつまんだ。少しためらってから、舌の上にのせた。"}, {"t": "p", "h": "何の味もしなかった。"}, {"t": "p", "h": "喉が閉じる前に、よしゆきはそれを手のひらに吐きだした。指の先で、白い粒をしばらく見ていた。"}, {"t": "p", "h": "胸の奥が、きゅっと縮んだ。かずまの顔を思い出すと、そこが痛んだ。痛むことは、まだ分かった。<strong>それだけは、なくなっていなかった。</strong>"}, {"t": "p", "h": "その夜、部屋のドアの下に、紙が一枚さしこまれていた。"}, {"t": "p", "h": "かずまの字だった。大きくて、右に傾いていた。紙のはしが、少し油でよごれていた。配達のとちゅうで書いたのかもしれなかった。"}, {"t": "p", "h": "「生きてるか。朝、席とっとく」"}, {"t": "p", "h": "よしゆきは紙を二つに折って、ポケットにしまった。返事は、何も書かなかった。"}, {"t": "p", "h": "次の朝、よしゆきは、食堂の前の道を、いつもより早く歩いた。食堂には入らずに、外の道から、窓ごしに中を見た。"}, {"t": "p", "h": "窓ぎわの長いテーブルに、かずまが一人で座っていた。自分のトレイの隣に、配達の鞄を置いて、席をとっていた。茶碗には、まだ手がついていなかった。湯気が細くなっても、かずまは箸を持たなかった。"}, {"t": "p", "h": "かずまは、入り口のほうを見ていた。人差し指は、頬に当てていなかった。"}, {"t": "p", "h": "よしゆきは、窓の前を足早に通りすぎた。"}, {"t": "opener", "i": 10, "alt": "第十章　消失", "lead": "その日の仕事を終えて部屋に戻ると、ドアの前に、ヤマがしゃがんでいた。"}, {"t": "p", "h": "その日の仕事を終えて部屋に戻ると、ドアの前に、ヤマがしゃがんでいた。"}, {"t": "p", "h": "両わきに、灰色の作業着が二人立っていた。食堂で見たことのある顔だった。どちらも、よしゆきのほうを見ていなかった。"}, {"t": "p", "h": "「お帰りなさい、<span class=\"up\">919</span>さん」"}, {"t": "p", "h": "「なんで、ここ知ってんだよ」"}, {"t": "p", "h": "「知ってますよ。全部」"}, {"t": "p", "h": "ヤマは立ちあがって、膝の汚れを払った。"}, {"t": "p", "h": "「今日は、お迎えです。うちに来てもらいます」"}, {"t": "p", "h": "「行かねーよ」"}, {"t": "p", "h": "「そうですか」"}, {"t": "p", "h": "ヤマは、よしゆきの上着のポケットのあたりを見た。"}, {"t": "p", "h": "「瓶、あと何本です」"}, {"t": "p", "h": "よしゆきは答えなかった。ポケットの中で、最後の三本が触れあった。"}, {"t": "p", "h": "「うちに来てもらえれば、瓶の心配はいりません。それに、ちゃんと調べられます。<span class=\"up\">919</span>さんの体が、先輩たちのようにならないように」"}, {"t": "p", "h": "ヤマは、わきに立つ二人のほうを、ちらりと見た。二人とも、まばたきもしなかった。"}, {"t": "p", "h": "「……行かなかったら」"}, {"t": "p", "h": "「行かなかったら、ですか」"}, {"t": "p", "h": "ヤマは首をかしげた。"}, {"t": "p", "h": "「かずまさん、でしたっけ。毎朝、席をとってる人。あの人、<span class=\"up\">919</span>さんのこと、ずっと見てますよね」"}, {"t": "p", "h": "よしゆきの手が、ポケットの中で止まった。"}, {"t": "p", "h": "「あの人に、毎朝見せるんですか。これから、だんだん変わっていくところを」"}, {"t": "p", "h": "ヤマは、片方の口角を上げなかった。ただ、じっとよしゆきを見上げていた。"}, {"t": "p", "h": "よしゆきは、しばらく何も言わなかった。それから、ドアの鍵を開けた。"}, {"t": "p", "h": "「着替えだけ、取らせろ」"}, {"t": "p", "h": "「荷物はいりません。うちに、全部あります」"}, {"t": "p", "h": "よしゆきは、部屋には入らなかった。上着のポケットに手を入れて、二つに折った紙がそこにあるのを、指の先で確かめた。それから、ドアの鍵をかけなおした。"}, {"t": "p", "h": "道のはしに、白い車が停まっていた。音もなく開いたドアの中は、何のにおいもしなかった。"}, {"t": "p", "h": "灰色の二人にはさまれて、よしゆきは後ろの席に座った。ヤマは前に座った。車は、音を立てずに動きだした。"}, {"t": "p", "h": "食堂の前を通った。夕飯の列ができていた。湯気のにおいは、車の中までは入ってこなかった。"}, {"t": "p", "h": "列の中ほどから、寝ぐせの立った頭が一つ突きでていた。かずまは、前の人の背中ごしに通りを見て、人差し指を頬に当てていた。何かを考えているときの顔だった。"}, {"t": "p", "h": "よしゆきは、窓ガラスに手をのばしかけて、やめた。窓は、たたかなかった。"}, {"t": "p", "h": "車は止まらなかった。食堂の明かりが、後ろの窓の中で小さくなっていった。"}, {"t": "p", "h": "上着のポケットで、紙が一度、かさりと鳴った。"}, {"t": "opener", "i": 11, "alt": "第十一章　丁か半か", "lead": "よしゆきがいなくなって、四日がたった。"}, {"t": "p", "h": "よしゆきがいなくなって、四日がたった。"}, {"t": "p", "h": "誰も、そのことを口にしなかった。食堂の入り口の機械は、ときどき券を読みそこねた。並んだ人たちは首をかしげて、もう一度かざした。直しに来る者はいなかった。"}, {"t": "p", "h": "かずまは、修理の事務所まで行ってみた。"}, {"t": "p", "h": "「ああ、あの人。辞めたんじゃないの」"}, {"t": "p", "h": "窓口の男は、端末から顔も上げずに言った。"}, {"t": "p", "h": "「辞めたって、誰に聞いたんだよ」"}, {"t": "p", "h": "「さあ。記録に、もう名前がないからね」"}, {"t": "p", "h": "部屋の名簿にも、よしゆきの名前はなかった。部屋のドアには、新しい鍵がついていた。ドアの前の、よしゆきの靴もなくなっていた。"}, {"t": "p", "h": "四日前の夕方、かずまは夕飯の列から、白い車を見ていた。音もなく食堂の前を通りすぎた車の、後ろの窓に、見おぼえのある横顔があった。丸い顔に、眉の上で切った前髪。"}, {"t": "p", "h": "それから毎朝、かずまは食堂の窓ぎわに座って、入り口を見ていた。"}, {"t": "p", "h": "よしゆきがいなくなって五日目の朝、灰色の作業着の配膳係が、一人の男の前に紙袋を置いた。紙袋の口から、細い透明な瓶の首がいくつものぞいていた。あの朝、よしゆきのポケットからのぞいていたのと、同じ瓶だった。"}, {"t": "p", "h": "前髪が目にかかるほど伸びた、ぼさぼさの頭の男だった。上着には、乾いた白いしみが点々とついている。男は紙袋をのぞいて、中の本数を指で数えはじめた。配膳係は、そのそばに黙って立っていた。"}, {"t": "p", "h": "かずまは立ちあがって、男の向かいに座った。"}, {"t": "p", "h": "「なあ」"}, {"t": "p", "h": "男が、黒目がちの目で、かずまを見上げた。"}, {"t": "p", "h": "「おはようございます、かずまさん」"}, {"t": "p", "h": "「……なんで名前、知ってんだよ」"}, {"t": "p", "h": "「知ってますよ。全部」"}, {"t": "p", "h": "「あんた、よしゆきのこと知ってるだろ」"}, {"t": "p", "h": "「さあ。どなたでしょう」"}, {"t": "p", "h": "「とぼけんな。あいつのポケットに、同じ瓶が入ってた」"}, {"t": "p", "h": "男は、テーブルの上の紙袋に目をやった。"}, {"t": "p", "h": "「ああ、これですか。届け物です」"}, {"t": "p", "h": "紙袋のわきに、白い伝票が貼ってあった。かずまは、一度だけそれを見た。"}, {"t": "p", "h": "男は、少しだけ首をかしげた。"}, {"t": "p", "h": "「ヤマといいます。それで、なんでしょう」"}, {"t": "p", "h": "かずまは、人差し指を頬に当てて、天井を見た。それから、ポケットから今朝の配給券を出して、手のひらで番号を隠したまま、テーブルに伏せた。"}, {"t": "p", "h": "「勝負しようぜ。この券の番号、偶数か奇数か。当てたら、あんたの勝ち。外したら、よしゆきの居場所を教えろ」"}, {"t": "p", "h": "「僕が勝ったら、何がもらえるんです」"}, {"t": "p", "h": "「は？　俺の配給券、全部やるよ。一年分」"}, {"t": "p", "h": "ヤマは、伏せた券を見て、それから、かずまの顔を見た。じっと、見上げるように見た。"}, {"t": "p", "h": "ヤマは、片方の口角だけを上げた。"}, {"t": "p", "h": "「偶数」"}, {"t": "p", "h": "かずまは手をどけて、券を裏返した。四桁の番号の、最後の数字は八だった。"}, {"t": "p", "h": "「当たりましたね」"}, {"t": "p", "h": "ヤマは楽しそうに言った。"}, {"t": "p", "h": "「約束ですよ。明日から一年、かずまさんの券は、僕のものです」"}, {"t": "p", "h": "「……分かってるよ」"}, {"t": "p", "h": "「朝ごはん、どうするんです」"}, {"t": "p", "h": "「知らねえ」"}, {"t": "p", "h": "ヤマは、また片方の口角を上げた。"}, {"t": "p", "h": "「今、どんな気持ち？」"}, {"t": "p", "h": "「最悪だよ」"}, {"t": "p", "h": "ヤマは紙袋を、そばに立っていた配膳係のほうへ押しやった。"}, {"t": "p", "h": "「確かに、そろってます」"}, {"t": "p", "h": "配膳係は紙袋を抱えて、黙って奥へ戻っていった。"}, {"t": "p", "h": "かずまは配達の鞄を肩にかけて、食堂を出た。振りかえらなかった。"}, {"t": "opener", "i": 12, "alt": "第十二章　空腹", "lead": "白い部屋には、窓がなかった。"}, {"t": "p", "h": "白い部屋には、窓がなかった。"}, {"t": "p", "h": "よしゆきは、壁ぎわの細いベッドに座っていた。朝と夜の区別は、ヤマが来るかどうかでしかつかなかった。"}, {"t": "p", "h": "毎朝、ヤマは薄い端末を持って入ってきて、よしゆきの顔と画面を見くらべた。画面には、数字が二つ並んでいた。一つは日ごとに上がり、もう一つは、日ごとに少しずつ下がっていた。それから、片方の口角を上げて、毎日同じことを聞いた。"}, {"t": "p", "h": "「どんな気持ち？」"}, {"t": "p", "h": "よしゆきは、一度も答えなかった。"}, {"t": "p", "h": "その朝、ヤマは端末のほかに、番号だけのラベルの瓶を一本持っていた。"}, {"t": "p", "h": "「器は、もうすぐできあがります。中身のほうが、毎日減ってるんです。先輩たちは、中身がなくなりました」"}, {"t": "p", "h": "ヤマは、瓶を軽く振った。"}, {"t": "p", "h": "「だから、今日から、こっちにします。中身がなくなる前に、器だけでも仕上げておきます」"}, {"t": "p", "h": "「……飲まねーよ」"}, {"t": "p", "h": "ヤマが、うしろに目をやった。灰色の作業着が二人入ってきて、よしゆきの両腕を押さえた。乾いた、冷たい手だった。"}, {"t": "p", "h": "ヤマはキャップを外して、瓶の口を、よしゆきの唇に押しあてた。"}, {"t": "p", "h": "「ほら。すぐ終わります」"}, {"t": "p", "h": "よしゆきは歯を食いしばった。瓶の口が、歯に当たって鳴った。"}, {"t": "p", "h": "そのとき、ドアが外から蹴りあけられた。"}, {"t": "p", "h": "配給品の箱を抱えた男が、肩から突っこんできた。箱がヤマの手に当たり、瓶が床に落ちて、割れた。"}, {"t": "p", "h": "寝ぐせの立った頭。顎の無精ひげが、いつもより濃くなっていた。"}, {"t": "p", "h": "かずまだった。"}, {"t": "p", "h": "腕を押さえていた手が、ゆるんだ。よしゆきの口から、勝手に言葉が出た。"}, {"t": "p", "h": "「……おせーよ」"}, {"t": "p", "h": "「は？　お前が早すぎんだよ」"}, {"t": "p", "h": "かずまは箱を放りだして、よしゆきの腕をつかみ、部屋の外へ引っぱりだした。"}, {"t": "p", "h": "白い廊下を、二人で走った。うしろから、灰色の作業着の足音が、同じ速さでついてくる。ヤマは追ってこなかった。端末を耳にあてて、反対の廊下へ歩いていくのが見えた。"}, {"t": "p", "h": "「……帰っても、お前に見せたくねーんだよ。変わっていくとこ」"}, {"t": "p", "h": "「は？　<strong>毎朝、席とってたんだぞ</strong>。バカみてえに」"}, {"t": "p", "h": "走りながら、かずまの目が、よしゆきのポケットからのぞく、二つに折った紙に行った。"}, {"t": "p", "h": "「……持ってたのかよ」"}, {"t": "p", "h": "突きあたりに、外への扉があった。かずまが取っ手を引いた。動かなかった。足音が近づいてくる。"}, {"t": "p", "h": "扉の横に、配膳係が一人立っていた。胸のポケットに、細い瓶。よしゆきは、その顔を知っていた。食堂で、腕をつかんだ男だった。あの男が、ここにもいた。"}, {"t": "p", "h": "男は、何も言わなかった。表情も変えなかった。ただ、腰の鍵を外して、扉の鍵穴にさしこんだ。"}, {"t": "p", "h": "扉が開いた。"}, {"t": "p", "h": "扉の外に、ヤマが立っていた。さっき反対の廊下へ消えたはずの男が、もう先に来ていた。"}, {"t": "p", "h": "「お帰りですか、<span class=\"up\">919</span>さん」"}, {"t": "p", "h": "それから、かずまを見た。"}, {"t": "p", "h": "「……どうやって、ここを」"}, {"t": "p", "h": "「あんたが食堂で数えてた紙袋。伝票の差出人に、ここの住所が書いてあった。こっちは毎日、何十枚も伝票見てんだよ。配達員、なめんな」"}, {"t": "p", "h": "かずまが、よしゆきの前に出た。"}, {"t": "p", "h": "「どけよ」"}, {"t": "p", "h": "「どきませんよ。<span class=\"up\">919</span>さんは、うちの大事な成功例ですから」"}, {"t": "p", "h": "ヤマは、片方の口角を上げた。"}, {"t": "p", "h": "「<span class=\"up\">919</span>さん。どんな気持ち？」"}, {"t": "p", "h": "よしゆきは、隣を見た。かずまが、肩で息をしていた。"}, {"t": "p", "h": "「……<strong>腹が減った</strong>」"}, {"t": "p", "h": "ヤマの口角が、上がったまま止まった。端末の画面に目を落として、そのまま動かなくなった。"}, {"t": "p", "h": "「……中身が、戻ってる」"}, {"t": "p", "h": "ヤマは、よしゆきと、隣のかずまを、順に見た。"}, {"t": "p", "h": "「ここに来てから、毎日減ってたんです。先輩たちと、同じ減り方で。それが、今、戻った」"}, {"t": "p", "h": "ヤマは、ゆっくり口角を下ろした。"}, {"t": "p", "h": "「……帰っていいですよ」"}, {"t": "p", "h": "ヤマは道をあけた。"}, {"t": "p", "h": "「<span class=\"up\">919</span>さんは、町にいたほうが、いいデータがとれますから。部屋も、券も、元に戻しておきます。消すのも戻すのも、すぐですから」"}, {"t": "p", "h": "それから、かずまのほうを見た。"}, {"t": "p", "h": "「それと、かずまさん。あなたのことも、記録に入れておきますね」"}, {"t": "p", "h": "かずまは返事をせずに、よしゆきの腕をつかんだまま歩きだした。"}, {"t": "p", "h": "遠くに、町の屋根が、朝の光の中に並んでいた。"}, {"t": "p", "h": "「腹が減ったって、お前、食えねえだろ」"}, {"t": "p", "h": "「うるせー。……減ったんだよ」"}, {"t": "p", "h": "うしろで、扉が静かに閉まる音がした。"}, {"t": "opener", "i": 13, "alt": "終章　補充", "lead": "朝の七時、共同の食堂には、もう長い列ができていた。"}, {"t": "p", "h": "朝の七時、共同の食堂には、もう長い列ができていた。"}, {"t": "p", "h": "よしゆきは列の後ろに並んで、入り口の機械に配給券をかざした。白い光が一度だけまたたいて、トレイが一枚せり出してくる。茶碗に半分のご飯と、薄い汁と、煮豆がひとさじ。先月より、また少し減っていた。"}, {"t": "p", "h": "施設から戻った、次の朝だった。券をかざしたのは、半月ぶりだった。"}, {"t": "p", "h": "よしゆきはトレイを持って、窓ぎわの長いテーブルの、いつもの席に座った。上着のポケットには、二つに折った紙が入ったままだった。部屋を出る前に、施設に行く日からポケットに入れたままだった瓶を、一本飲んできた。"}, {"t": "p", "h": "食堂の奥では、灰色の作業着の配膳係たちが、空になったトレイを黙って重ねていた。その中の一人が、ときどき、よしゆきのほうを見た。胸のポケットの瓶のラベルは、<span class=\"up\">525</span>だった。見るだけで、手の速さは変わらなかった。"}, {"t": "p", "h": "しばらくして、入り口から、寝ぐせの頭が歩いてきた。手には、何も持っていなかった。"}, {"t": "p", "h": "「おせーよ」"}, {"t": "p", "h": "「お前が早すぎんだよ」"}, {"t": "p", "h": "かずまは隣に座って、背もたれに体をあずけた。よしゆきの前のトレイを見て、それから、よしゆきの顔を見た。"}, {"t": "p", "h": "よしゆきは、トレイをかずまの前へ押しやった。"}, {"t": "p", "h": "「<strong>やるよ</strong>」"}, {"t": "p", "h": "「は？　配給、いらねえやつがいるかよ」"}, {"t": "p", "h": "「いるんだよ、ここに」"}, {"t": "p", "h": "かずまは、しばらくトレイを見ていた。それから、箸を取った。"}, {"t": "p", "h": "「……二人前は、食えねえぞ」"}, {"t": "p", "h": "「一人前しかねーよ」"}, {"t": "p", "h": "かずまは箸を持ったまま、茶碗のご飯を見ていた。"}, {"t": "p", "h": "「……助かる。券、一年分、取られてんだよ」"}, {"t": "p", "h": "「……誰に」"}, {"t": "p", "h": "「お前の、知りあいに」"}, {"t": "p", "h": "よしゆきは、何も言えなかった。かずまは、それ以上は言わずに、汁をすすった。"}, {"t": "p", "h": "かずまは煮豆を一粒、口に放りこんだ。それから、人差し指を頬に当てて、天井を見た。"}, {"t": "p", "h": "「なあ、豆とご飯、どっちが腹にたまると思う」"}, {"t": "p", "h": "「知らねーよ」"}, {"t": "p", "h": "「俺はご飯に賭ける」"}, {"t": "p", "h": "「何も賭けてねーだろ」"}, {"t": "p", "h": "「は？　賭けてるわ。外れたら、俺の煮豆やるよ」"}, {"t": "p", "h": "かずまはご飯をひと口すくった。それを、よしゆきの口元に差しだした。"}, {"t": "p", "h": "「ほら、検証」"}, {"t": "p", "h": "箸の先は、よしゆきの口の少し手前で止まっていた。押しこみもしないし、引っこめもしなかった。"}, {"t": "p", "h": "寮の食堂でも、この食堂でも、何度も同じことをされた。そのときのご飯の味は、もう思い出せなかった。押しこまれた箸の先と、むせた喉と、かずまの笑い声だけは、覚えていた。"}, {"t": "p", "h": "「食えねーって言ってんだろ」"}, {"t": "p", "h": "「知ってるわ」"}, {"t": "p", "h": "かずまは、差しだしたご飯を、そのまま自分の口に入れた。噛みながら、言った。"}, {"t": "p", "h": "「たまった」"}, {"t": "p", "h": "「お前の腹がな」"}, {"t": "p", "h": "かずまが声をあげて笑った。よしゆきもつられて、歯を見せて、目がなくなるほど笑った。肩がゆれて、ひじが汁の椀に当たった。"}, {"t": "p", "h": "「きったねえ」"}, {"t": "p", "h": "「お前の汁だろ」"}, {"t": "p", "h": "よしゆきが言うと、かずまが言いかえした。"}, {"t": "p", "h": "「お前の券のだろ」"}, {"t": "p", "h": "かずまは自分の袖で、テーブルの汁をふいた。袖が茶色くなった。"}, {"t": "p", "h": "かずまは茶碗のご飯をかきこんで、配達の鞄を肩にかけた。出口で一度振りかえり、片手を上げて、出ていった。"}, {"t": "p", "h": "よしゆきは、空になったトレイを、返却口まで持っていった。灰色の作業着の手が、黙ってそれを受けとった。<span class=\"up\">525</span>の男の手だった。乾いていて、指の先まで白かった。"}, {"t": "p", "h": "その夜、部屋のドアの前に、紙袋が置いてあった。"}, {"t": "p", "h": "よしゆきは紙袋を拾って、中をのぞいた。七本の瓶が、きっちり並んでいた。どれも、同じラベル。<span class=\"sw\">Sui919</span>。"}, {"t": "p", "h": "その下に、もう一本、入っていた。"}, {"t": "p", "h": "八本目の瓶のラベルには、何の文字もなかった。番号だけが、小さく印字されていた。"}, {"t": "p", "h": "<strong><span class=\"up\">920</span>。</strong>"}, {"t": "end", "h": "了"}, {"t": "stub"}], "chapters": [{"title": "序章　配給", "b": 0}, {"title": "第一章　無味無臭", "b": 40}, {"title": "第二章　拒絶反応", "b": 83}, {"title": "第三章　無傷", "b": 121}, {"title": "第四章　一日一本", "b": 153}, {"title": "第五章　欠食", "b": 190}, {"title": "第六章　再検証", "b": 232}, {"title": "第七章　識別番号", "b": 264}, {"title": "第八章　先輩", "b": 291}, {"title": "第九章　味覚欠落", "b": 331}, {"title": "第十章　消失", "b": 353}, {"title": "第十一章　丁か半か", "b": 386}, {"title": "第十二章　空腹", "b": 434}, {"title": "終章　補充", "b": 493}]};

function stubDay(){ const d=new Date(); return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate(); }
function stubNo(){

/* ---------- しおり ---------- */
const BM_KEY = 'shiori:' + DATA.title;
DATA.blocks.forEach((b,i)=>{ b.src=i; });
let bm = null;
try{ const v = localStorage.getItem(BM_KEY); bm = v ? JSON.parse(v) : null; }catch(e){ bm = null; }
function saveBm(){ try{ if(bm) localStorage.setItem(BM_KEY, JSON.stringify(bm)); else localStorage.removeItem(BM_KEY); }catch(e){} }
function anchorOf(p){
  const pg = pages[p]; if(!pg) return null;
  for(const b of pg){ if(b && b.src!=null) return {s:b.src, p:b.part||0}; }
  if(pg[0] && pg[0].t==='toc') return {toc:true};
  return null;
}
function pageOfAnchor(a){
  if(!a) return -1;
  if(a.toc) return pages.findIndex(pg=>pg[0] && pg[0].t==='toc');
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src===a.s && (b.part||0)>=a.p) return p;
  for(let p=1;p<pages.length;p++) for(const b of pages[p]) if(b && b.src!=null && b.src>=a.s) return p;
  return -1;
}
function visiblePages(){ return (spread && idx>0) ? [idx, idx+1] : [idx]; }
function toggleBm(){
  const bp = pageOfAnchor(bm), vis = visiblePages();
  if(bm && vis.indexOf(bp)>=0){ bm = null; }
  else { const a = anchorOf(idx); if(!a) return; bm = a; }
  saveBm(); update(0);
}
function goBm(){ const p = pageOfAnchor(bm); if(p<0) return; idx = p; closeSheets(); update(1); }
function renderToc(host){
  const w = document.createElement('div'); w.className='tocpage';
  w.innerHTML = '<h2>目次</h2>';
  DATA.chapters.forEach((c,i)=>{
    const parts = c.title.split('\u3000');
    const row = document.createElement('div'); row.className='ti';
    const b = document.createElement('button'); b.className='tb'; b.type='button';
    b.setAttribute('aria-label', c.title.replace('\u3000',' ')+'へ移動');
    b.innerHTML = '<span class="n">'+parts[0]+'</span><span class="t">'+(parts[1]||'')+'</span>';
    b.onclick = (e)=>{ e.stopPropagation(); idx = chapPage[i]||1; update(1); };
    row.appendChild(b);
    row.insertAdjacentHTML('beforeend','<span class="d" aria-hidden="true"></span><span class="p" aria-hidden="true">'+(chapPage[i]||'')+'</span>');
    w.appendChild(row);
  });
  host.appendChild(w);
  let fs = 1;
  w.style.fontSize = fs+'em';
  const page = host.closest('.page');
  const fits = ()=>{ const r=w.getBoundingClientRect(), pr=page.getBoundingClientRect(); return vertical ? r.left >= pr.left+8 && w.scrollHeight<=w.clientHeight+2 : r.bottom <= pr.bottom-8; };
  let guard=0;
  while(!fits() && fs>0.5 && guard++<20){ fs -= 0.05; w.style.fontSize = fs.toFixed(2)+'em'; }
}

/* ---------- blocks -> DOM ---------- */
function makeEl(b){
  let el;
  if(b.t==='h2'){ el=document.createElement('h2'); el.innerHTML=b.h; }
  else if(b.t==='quote'){ el=document.createElement('blockquote'); el.innerHTML=b.h; }
  else if(b.t==='sep'){ el=document.createElement('div'); el.className='sep'; el.innerHTML=SEPSVG; }
  else if(b.t==='opener'){ el=document.createElement('div'); el.className='opener lab'; const pr=b.alt.split('\u3000'); const num=/^\d+$/.test(pr[1]||''); el.innerHTML='<span class="no">No.0919-'+String(b.i).padStart(2,'0')+'</span><div class="tag"><span class="n">'+pr[0]+'</span><span class="t'+(num?' dg':'')+'">'+(pr[1]||'')+'</span></div>'; el.setAttribute('role','heading'); el.setAttribute('aria-level','2'); el.setAttribute('aria-label',b.alt.replace('\u3000',' ')); }
  else if(b.t==='stub'){ el=document.createElement('div'); el.className='opener stub'; el.innerHTML='<div class="ticket"><span class="perf" aria-hidden="true"></span><span class="k">朝の配給</span><span class="no">No.'+stubNo()+'</span><span class="d">'+stubDay()+'</span></div><button type="button" class="back">表紙へ</button>'; el.querySelector('.back').onclick=function(e){ e.stopPropagation(); idx=0; update(-1); }; }
  else if(b.t==='end'){ el=document.createElement('p'); el.className='endmark'; el.textContent=b.h; }
  else if(b.t==='next'){ el=document.createElement('div'); el.className='nextnav'; el.innerHTML=b.h; }
  else { el=document.createElement('p'); el.innerHTML=b.h; }
  return el;
}
function contentBox(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  return {
    left:   r.left   + parseFloat(cs.paddingLeft   || 0),
    right:  r.right  - parseFloat(cs.paddingRight  || 0),
    top:    r.top    + parseFloat(cs.paddingTop    || 0),
    bottom: r.bottom - parseFloat(cs.paddingBottom || 0)
  };
}
/* scrollWidth is unreliable in vertical-rl (content overflows leftward),
   so compare the last child's far edge with the page's content box. */
function over(el){
  const kids = el.children;
  if(!kids.length) return false;
  const box = contentBox(el);
  const k = kids[kids.length-1], r = k.getBoundingClientRect(), ks = getComputedStyle(k);
  return vertical
    ? (r.left - parseFloat(ks.marginLeft || 0)) < box.left - 0.5
    : (r.bottom + parseFloat(ks.marginBottom || 0)) > box.bottom + 0.5;
}
function splitText(t){
  const out=[]; let cur='';
  for(let i=0;i<t.length;i++){
    cur+=t[i];
    if('。！？」'.indexOf(t[i])>=0 && cur.length>=40){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out.length?out:[t];
}

  const m = document.getElementById('measure'), mc = document.getElementById('mcol');
  const ref = document.getElementById('pageA').getBoundingClientRect();
  m.className='page';
  m.style.width = ref.width+'px';
  m.style.height = ref.height+'px';
  mc.innerHTML='';

  /* NOTOCPAGE：最初の目次のページはなくし、上の帯の「目次」からだけ開く */ pages = [[{t:'cover'}]];
  chapPage = [];
  let cur = [];
  const push = ()=>{ if(cur.length){ pages.push(cur); cur=[]; } mc.innerHTML=''; };

  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const drop = el => { if(el && el.parentNode) el.parentNode.removeChild(el); };

  // 1ページに単独で収まらない塊を、収まる単位に割って順番どおり流しこむ
  const flowSplit = (b)=>{
    let part = 0;
    if(b.t==='quote'){                    // 手紙は行単位で分ける
      const trim = a=>{ const c=a.slice();
        while(c.length && c[0]==='') c.shift();
        while(c.length && c[c.length-1]==='') c.pop();
        return c; };
      const lines = b.h.split('<br>');
      let buf=[], node=null;
      for(const ln of lines){
        const trial = buf.concat([ln]);
        drop(node);
        node = makeEl({t:'quote', h: trim(trial).join('<br>')});
        mc.appendChild(node);
        if(over(mc) && trim(buf).length){
          drop(node);
          cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
          push();
          buf = (ln==='') ? [] : [ln];
          node = buf.length ? makeEl({t:'quote', h: ln}) : null;
          if(node) mc.appendChild(node);
        } else {
          buf = trial;
        }
      }
      if(trim(buf).length) cur.push({t:'quote', h: trim(buf).join('<br>'), src:b.src, part:part++});
      return;
    }
    for(const c of splitText(makeEl(b).textContent)){   // 段落は文単位で分ける
      const blk = {t:'p', h: esc(c), src:b.src, part:part++};
      let node = makeEl(blk);
      mc.appendChild(node);
      if(over(mc) && cur.length){ drop(node); push(); node = makeEl(blk); mc.appendChild(node); }
      cur.push(blk);
    }
  };

  const feed = (b, chIndex)=>{
    if(b.t==='opener'||b.t==='stub'){ push(); if(chIndex!=null) chapPage[chIndex]=pages.length; pages.push([b]); mc.innerHTML=''; return; }
    const el = makeEl(b);
    mc.appendChild(el);
    if(over(mc)){
      mc.removeChild(el);
      if(cur.length) push();
      mc.appendChild(el);
      if(over(mc)){                       // ページ丸ごと使っても収まらない
        mc.removeChild(el);
        if(chIndex!=null) chapPage[chIndex] = pages.length;
        flowSplit(b);
        return;
      }
    }
    if(chIndex!=null) chapPage[chIndex] = pages.length;
    cur.push(b);
  };

  const chStart = {};
  DATA.chapters.forEach((c,i)=>{ chStart[c.b]=i; });
  DATA.blocks.forEach((b,i)=> feed(b, chStart[i]!=null?chStart[i]:null));
  push();

  // verify: re-measure every page and move any spilled block to the next one
  for(let p=1;p<pages.length;p++){
    if(pages[p][0] && (pages[p][0].t==='toc' || pages[p][0].t==='opener' || pages[p][0].t==='stub')) continue;
    mc.innerHTML='';
    const keep=[]; const spill=[];
    for(const b of pages[p]){
      if(spill.length){ spill.push(b); continue; }
      const el=makeEl(b); mc.appendChild(el);
      if(over(mc) && keep.length){ mc.removeChild(el); spill.push(b); }
      else keep.push(b);
    }
    if(spill.length){
      pages[p]=keep;
      pages.splice(p+1,0,spill);
      for(let c=0;c<chapPage.length;c++) if(chapPage[c]>p) chapPage[c]++;
    }
  }
  mc.innerHTML='';
  if(pages.length%2===0 && spread) pages.push([{t:'blank'}]);
}

/* ---------- render ---------- */
function renderPage(hostPage, page){
  const host = hostPage.querySelector('.col');
  host.innerHTML='';
  hostPage.classList.remove('blank');
  if(!page){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='cover'){
    host.innerHTML = '<div class="opener cov" style="background:#E6EBE6"><div class="covbg t" style="background-image:url('+COVER+')"></div><div class="covbg b" style="background-image:url('+COVER+')"></div><img alt="'+DATA.title+'　'+DATA.sub+'" src="'+COVER+'"></div>';
    setTimeout(fitCov,0);
    return;
  }
  if(page[0] && page[0].t==='blank'){ hostPage.classList.add('blank'); return; }
  if(page[0] && page[0].t==='toc'){ renderToc(host); return; }
  page.forEach(b=> host.appendChild(makeEl(b)));
}

function update(dir){
  const A=document.getElementById('pageA'), B=document.getElementById('pageB');
  if(spread && idx>0 && idx%2===0) idx--;
  idx = Math.max(0, Math.min(pages.length-1, idx));

  if(spread && idx>0){ renderPage(A,pages[idx]); renderPage(B,pages[idx+1]); }
  else { renderPage(A,pages[idx]); renderPage(B,null); }

  if(dir){
    const dx = (dir>0 ? (vertical?-14:14) : (vertical?14:-14))+'px';
    [A,B].forEach(el=>{ el.style.setProperty('--dx',dx); el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); });
  }

  const bp = pageOfAnchor(bm), vis = visiblePages();
  A.classList.toggle('marked', bm!=null && bp===vis[0]);
  B.classList.toggle('marked', bm!=null && vis.length>1 && bp===vis[1]);
  const here = bm!=null && vis.indexOf(bp)>=0;
  const bb = document.getElementById('bmBtn');
  bb.setAttribute('aria-pressed', String(here));
  bb.disabled = (idx===0 && !spread) || (idx===0);
  bb.setAttribute('aria-label', here ? 'しおりを外す' : 'このページにしおりをはさむ');
  document.getElementById('bmJump').hidden = !(bm && bp>0 && !here);
  const bi = document.getElementById('bmItem');
  bi.hidden = !(bm && bp>0);
  if(bp>0) bi.textContent = 'しおりのページへ（' + bp + '）';
  const last = pages.length-1;
  /* DONEFIX2：最後のページが画面に出たら読了 */ try{
    var _vk='919:seen:'+DATA.title, _seen={}; try{ _seen=JSON.parse(localStorage.getItem(_vk)||'{}'); }catch(e){}
    visiblePages().forEach(function(p){ var ci=-1; for(var i=0;i<chapPage.length;i++){ if(chapPage[i]!=null && chapPage[i]<=p) ci=i; } if(ci>=0) _seen[ci]=1; });
    localStorage.setItem(_vk, JSON.stringify(_seen));
    var _all = DATA.chapters.every(function(c,i){ return !!_seen[i]; });
    if(last>0 && visiblePages().indexOf(last)>=0) localStorage.setItem('919:done:'+DATA.title,'1');
  }catch(e){}
  const prog = last>0 ? idx/last : 0;
  document.getElementById('liq').setAttribute('width', Math.max(0, 280*(1-prog)).toFixed(1));
  document.getElementById('finalmark').classList.toggle('show', idx===last);

  let name='';
  for(let i=0;i<DATA.chapters.length;i++){ if(chapPage[i]!=null && chapPage[i]<=idx) name=DATA.chapters[i].title; }
  document.getElementById('chapNow').textContent = idx===0 ? '' : name;
  document.getElementById('pageNow').textContent = idx===0 ? '表紙' : (idx + ' / ' + last);
  document.querySelectorAll('.toc-item').forEach(el=>{
    el.setAttribute('aria-current', String(Number(el.dataset.p)<=idx && (Number(el.dataset.next)>idx || el.dataset.next==='')));
  });
}

function go(step){ const n=idx+step*(spread&&idx>0?2:1); if(n<0||n>pages.length-1) return; idx=n; update(step); }
function next(){ go(1); } function prev(){ go(-1); }

/* ---------- column fitting ---------- */
function fitColumn(){
  const pa = document.getElementById('pageA'), cs = getComputedStyle(pa);
  const avail = vertical
    ? pa.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
    : pa.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const n = CHARS[sizeIdx];
  let fs = Math.min(SIZES[sizeIdx], avail / (n * KERN));
  fs = Math.max(12.5, fs);
  const colw = Math.min(avail, Math.floor(fs * n * KERN));
  document.documentElement.style.setProperty('--fs', fs.toFixed(2)+'px');
  document.documentElement.style.setProperty('--colw', colw+'px');
}

/* ---------- layout ---------- */
function layout(keepBlock){
  spread = window.innerWidth >= 940 && window.innerHeight >= 420;
  document.body.classList.toggle('spread', spread);
  document.body.classList.toggle('vert', vertical);
  document.documentElement.style.setProperty('--fs', SIZES[sizeIdx]+'px');
  document.documentElement.style.setProperty('--lh', vertical? '1.95' : '2.05');
  requestAnimationFrame(()=>{
    fitColumn();
    paginate();
    if(keepBlock!=null){
      let found=0;
      for(let p=1;p<pages.length;p++){ if(pages[p].some(b=>b===keepBlock)){ found=p; break; } }
      idx = found || Math.min(idx, pages.length-1);
    }
    buildToc();
    update(0);
  });
}
function currentBlock(){ const p=pages[idx]; return p && p[0] && p[0].t!=='cover' ? p[0] : null; }

/* ---------- toc ---------- */
function buildToc(){
  const list=document.getElementById('tocList');
  list.innerHTML='';
  DATA.chapters.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='toc-item'; b.dataset.p=chapPage[i]||1;
    b.dataset.next = (chapPage[i+1]!=null? chapPage[i+1] : '');
    b.innerHTML='<span>'+c.title+'</span><span class="pg">'+(chapPage[i]||1)+'</span>';
    b.onclick=()=>{ idx=chapPage[i]||1; closeSheets(); update(1); };
    list.appendChild(b);
  });
}

/* ---------- sheets ---------- */
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
try{ if(!/claude\.ai$/i.test(location.hostname) && !/^blob:/.test(location.href)) document.getElementById('homeLink').hidden=false; }catch(e){}
document.getElementById('bmBtn').onclick=toggleBm;
document.getElementById('bmJump').onclick=goBm;
document.getElementById('bmItem').onclick=goBm;
document.getElementById('tocBtn').onclick=()=>document.getElementById('tocSheet').classList.add('open');
document.getElementById('setBtn').onclick=()=>document.getElementById('setSheet').classList.add('open');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) closeSheets(); }));

document.getElementById('dirSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  vertical = b.dataset.dir==='v';
  document.querySelectorAll('#dirSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};
document.getElementById('sizeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const keep=currentBlock();
  sizeIdx=Number(b.dataset.size);
  document.querySelectorAll('#sizeSeg button').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  layout(keep);
};

/* ---------- input ---------- */
/* 目次ページの項目がページ送りの領域の下にあっても押せるようにする */
function tocHit(e){
  if(!e || (!e.clientX && !e.clientY)) return false;
  const zs=document.querySelectorAll('.zone'); zs.forEach(z=>z.style.pointerEvents='none');
  const el=document.elementFromPoint(e.clientX,e.clientY);
  zs.forEach(z=>z.style.pointerEvents='');
  const t=el && el.closest ? el.closest('.tocpage .tb') : null;
  if(t){ t.click(); return true; }
  return false;
}
document.getElementById('zoneL').onclick=e=>{ if(tocHit(e)) return; vertical? next() : prev(); };
document.getElementById('zoneR').onclick=e=>{ if(tocHit(e)) return; vertical? prev() : next(); };
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') vertical?prev():next();
  else if(e.key==='ArrowLeft') vertical?next():prev();
  else if(e.key===' '||e.key==='ArrowDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowUp') prev();
  else if(e.key==='Escape') closeSheets();
});
let tx=0,ty=0;
const bookEl=document.getElementById('book');
bookEl.addEventListener('touchstart',e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; },{passive:true});
bookEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<44 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx<0) vertical?prev():next(); else vertical?next():prev();
},{passive:true});

let rt;
window.addEventListener('resize',()=>{ clearTimeout(rt); const keep=currentBlock(); rt=setTimeout(()=>layout(keep),180); });

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>layout(null)); }
layout(null);

/* 表紙の余白を、表紙の端の色でつなぐ（上下か左右かを画面の形で判定） */
function fitCov(){
  document.querySelectorAll('.opener.cov').forEach(function(op){
    var im=op.querySelector('img'); if(!im) return;
    var set=function(){
      var W=op.clientWidth, H=op.clientHeight; if(!W||!H) return;
      var r=(im.naturalWidth||600)/(im.naturalHeight||960);
      var lr = (W/H) > r;
      op.classList.toggle('lr', lr);
    };
    if(im.complete) set(); else im.addEventListener('load', set, {once:true});
  });
}
window.addEventListener('resize', function(){ setTimeout(fitCov, 250); });

/* CHJUMP: トップページからの「章をえらぶ」 */
(function(){ var m=location.search.match(/[?&]ch=(\d+)/); if(!m) return; var c=+m[1];
  var t=function(n){ try{ if(typeof chapPage!=='undefined' && chapPage[c]){ idx=chapPage[c]; update(0); return; } }catch(e){} if(n>0) setTimeout(function(){ t(n-1); },300); };
  setTimeout(function(){ t(6); },300); })();
/* shioriAuto: トップページからの「しおりの続きから」 */
if(/[?&]shiori=1/.test(location.search)){
  var _try=function(n){
    try{
      if(bm){ var p=pageOfAnchor(bm); if(p>0){ idx=p; update(0); return; } }
    }catch(e){}
    if(n>0) setTimeout(function(){ _try(n-1); }, 300);
  };
  setTimeout(function(){ _try(6); }, 300);
}
</script>
