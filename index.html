<style>
:root{
  --bg1:#DCE3E3; --bg2:#B8C4C6; --ink:#1D2528; --soft:#56646A; --line:rgba(29,37,40,.18);
  --paper:#F6F6F1; --paper-ink:#2A2F33; --print:#2F6670; --dot:#47567E; --glow:rgba(255,255,255,.85);
  --shelf:#C9D1D3; --shelf-edge:#9AA6AA; --shadow:rgba(20,30,34,.28);
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --dotf:"DotGothic16","Zen Kaku Gothic New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#3E4C52; --bg2:#1E272B; --ink:#EEF2F2; --soft:#A9B6BA; --line:rgba(238,242,242,.16);
    --paper:#F2F2EC; --paper-ink:#2A2F33; --print:#7FB6BF; --dot:#47567E; --glow:rgba(255,255,255,.22);
    --shelf:#5B676C; --shelf-edge:#3A4448; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#3E4C52; --bg2:#1E272B; --ink:#EEF2F2; --soft:#A9B6BA; --line:rgba(238,242,242,.16);
  --paper:#F2F2EC; --paper-ink:#2A2F33; --print:#7FB6BF; --dot:#47567E; --glow:rgba(255,255,255,.22);
  --shelf:#5B676C; --shelf-edge:#3A4448; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg2)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--gothic);
  background:radial-gradient(ellipse 70% 55% at 32% 38%,var(--glow),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--print);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:44px 22px 64px}

/* 題字 */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:34px}
.head h1{margin:0;font-family:var(--mincho);font-weight:800;font-size:clamp(64px,13vw,112px);line-height:.9;letter-spacing:.06em}
.head .by{font-family:var(--mincho);font-size:15px;letter-spacing:.3em;color:var(--soft);margin:0 0 8px}
.lead{margin:0 0 30px;font-family:var(--mincho);font-size:15px;line-height:2;color:var(--soft);max-width:34em}
.lead .nb{white-space:nowrap}

/* 棚 */
.shelf{position:relative;padding:22px 18px 0;margin-bottom:46px}
.shelf .row{display:flex;align-items:flex-end;gap:22px;min-height:250px;padding:0 6px}
.shelf .board{height:16px;margin:0 -18px;background:linear-gradient(180deg,var(--shelf),var(--shelf-edge));border-radius:2px;box-shadow:0 10px 18px -8px var(--shadow)}
.shelf .post{position:absolute;top:0;bottom:0;width:8px;background:linear-gradient(90deg,var(--shelf-edge),var(--shelf))}
.shelf .post.l{left:0}.shelf .post.r{right:0}
.book{display:block;border:0;padding:0;background:none;cursor:pointer;position:relative}
.book img{display:block;width:150px;height:240px;object-fit:cover;box-shadow:0 12px 20px -10px var(--shadow),0 0 0 1px rgba(0,0,0,.08);transition:transform .25s}
.book:hover img{transform:translateY(-6px)}
.book .done{position:absolute;left:8px;bottom:10px;font-family:var(--dotf);font-size:12px;letter-spacing:.08em;background:rgba(246,246,241,.92);color:var(--print);padding:3px 7px;border:1px solid rgba(47,102,112,.4)}
.box{width:118px;height:190px;background:linear-gradient(160deg,#F7F7F3,#E3E6E3);box-shadow:0 12px 20px -10px var(--shadow),0 0 0 1px rgba(0,0,0,.06);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;color:#5E6A6E}
.box::before{content:"";position:absolute;left:0;right:0;top:42%;height:22px;background:rgba(200,206,203,.55)}
.box .no{font-family:var(--dotf);font-size:13px;letter-spacing:.12em;position:relative}
.box .st{font-family:var(--dotf);font-size:12px;letter-spacing:.2em;position:relative}
.box.dim{opacity:.55;width:104px;height:170px}

/* 観察記録 */
.rec h2{font-family:var(--dotf);font-weight:400;font-size:14px;letter-spacing:.24em;color:var(--soft);margin:0 0 10px}
.rec ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rec li{display:flex;align-items:baseline;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);font-family:var(--mincho)}
.rec .ep{font-family:var(--dotf);font-size:13px;letter-spacing:.1em;color:var(--soft);width:7.5em;flex:none}
.rec .t{flex:1;font-size:16px}
.rec .s{font-family:var(--dotf);font-size:13px;letter-spacing:.08em;color:var(--soft)}
.rec .s.ok{color:var(--print)}
.rec .recbtn{display:flex;align-items:baseline;gap:14px;width:100%;padding:12px 2px;margin:-12px -2px;border:0;background:none;text-align:left;cursor:pointer;font-family:var(--mincho);color:inherit}
.rec .recbtn:hover .t{text-decoration:underline;text-underline-offset:4px}
.rec .go-arrow{font-family:var(--gothic);color:var(--soft);font-size:18px;line-height:1}

.foot{margin-top:46px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--soft)}

/* 配給ボタン */
.haikyu{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:2px;cursor:pointer;letter-spacing:.2em}
.haikyu svg{width:26px;height:14px}

/* 配給券の札 */
.veil{position:fixed;inset:0;background:rgba(14,20,23,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.veil[hidden]{display:none}
.ticket{position:relative;width:min(440px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--paper);color:var(--paper-ink);padding:34px 26px 24px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6)}
.ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:12px;background:radial-gradient(circle at 6px 6px,rgba(14,20,23,.55) 3.4px,transparent 3.8px) repeat-x;background-size:12px 12px}
.ticket::before{top:-6px}.ticket::after{bottom:-6px}
.ticket .top{display:flex;justify-content:space-between;font-family:var(--dotf);font-size:13px;letter-spacing:.14em;color:#6F7A7E;border-bottom:1px dashed #C6CBC8;padding-bottom:10px;margin-bottom:18px}
.ticket .top .num{color:var(--dot);font-size:15px}
.ticket .series{font-family:var(--dotf);font-size:13px;letter-spacing:.2em;color:var(--print);margin:0}
.ticket h3{margin:4px 0 14px;font-family:var(--mincho);font-weight:800;font-size:28px;letter-spacing:.12em}
.ticket .syn{font-family:var(--mincho);font-size:15px;line-height:2;margin:0 0 14px}
.ticket .meta{font-family:var(--dotf);font-size:13px;letter-spacing:.1em;color:#6F7A7E;margin:0 0 20px}
.ticket .acts{display:flex;flex-direction:column;gap:10px}
.ticket .acts a,.ticket .acts button{display:block;text-align:center;text-decoration:none;padding:12px;font-size:15px;letter-spacing:.24em;border:1px solid #2A2F33;cursor:pointer}
.ticket .acts .go{background:#2A2F33;color:#F6F6F1}
.ticket .acts .sub{background:transparent;color:#2A2F33}
.ticket .acts .sub[hidden]{display:none}
.ticket .row2{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.ticket .close{border:0;background:none;color:#6F7A7E;cursor:pointer;font-size:14px;letter-spacing:.2em;padding:6px}
.ticket .haikyu{border-color:#C6CBC8;color:#2A2F33}
.rec li.memo{border-bottom:1px solid var(--line);padding:4px 2px 12px}
.rec li.memo .mt{font-family:var(--dotf);font-size:12px;letter-spacing:.12em;color:var(--print)}
.ticket .chs{margin-top:14px;border-top:1px dashed #C6CBC8;padding-top:10px}
.ticket .chs summary{cursor:pointer;font-size:14px;letter-spacing:.24em;color:#2A2F33;list-style:none;padding:4px 0}
.ticket .chs summary::-webkit-details-marker{display:none}
.ticket .chs summary::after{content:"＋";float:right;color:#6F7A7E}
.ticket .chs[open] summary::after{content:"－"}
.ticket .chs ol{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ticket .chs a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:#2A2F33;border:1px solid #D5D9D6;padding:7px 9px;font-size:14px}
.ticket .chs a .n{font-size:11px;color:#6F7A7E;letter-spacing:.06em;white-space:nowrap}
.ticket .chs a.here{border-color:var(--print);background:rgba(47,102,112,.06)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2A2F33;color:#F6F6F1;padding:10px 16px;font-size:13px;letter-spacing:.1em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.on{opacity:1}

/* 入口の動き：券を読む光 */
.gate{position:fixed;inset:0;z-index:40;background:#141C1F;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease .9s}
.gate .scan{width:min(70vw,420px);height:2px;background:#fff;box-shadow:0 0 18px 6px rgba(255,255,255,.75),0 0 60px 20px rgba(160,210,215,.35);opacity:0;animation:blink .55s ease-out .25s forwards}
@keyframes blink{0%{opacity:0;transform:scaleX(.2)}35%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}
.gate.off{opacity:0;pointer-events:none}
.gate[hidden]{display:none}
.slide{animation:tray .7s cubic-bezier(.2,.7,.2,1) 1.0s both}
@keyframes tray{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.gate{display:none}.slide{animation:none}}
@media (max-width:560px){
  .wrap{padding:30px 16px 52px}
  .book img{width:124px;height:198px}
  .box{width:96px;height:156px}.box.dim{display:none}
  .shelf .row{min-height:206px;gap:16px}
}
</style>
</head>
